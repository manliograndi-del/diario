document.getElementById("app").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-az]"); if(!b) return;
  var az=b.getAttribute("data-az"), v=b.getAttribute("data-v");

  if(az==="vista"){ S.vista=v; S.scelto=null; S.focus=null; S.aperto=null; S.finestra=null; if(v==="aggiungi"){S.pasto=pastoDaOra();} render(); }
  else if(az==="chiudi-msg"){ S.msg=null; render(); }
  else if(az==="togli"){ var id=b.getAttribute("data-id"); S.voci=S.voci.filter(function(x){return x.id!==id;}); salva(); render(); }
  else if(az==="scegli"){ var a=trovaPerId(b.getAttribute("data-id")); if(a){S.scelto=a;S.grammi=a.porz||100;S.focus=null;render();} }
  else if(az==="scegli-rec"){ var r=S.recenti[Number(b.getAttribute("data-i"))]; if(r){S.scelto=r;S.grammi=r.porz||100;S.focus=null;render();} }
  else if(az==="deseleziona"){ S.scelto=null; S.focus=null; render(); }
  else if(az==="qta"){ S.grammi=Number(v); S.focus=null; render(); }
  else if(az==="passo"){ S.grammi=Math.max(0,S.grammi+Number(v)); S.focus=null; render(); }
  else if(az==="pasto"){ S.pasto=v; render(); }
  else if(az==="conferma"){ aggiungiVoce(S.scelto,S.grammi,S.pasto); }
  else if(az==="salva-mio"){
    S.miei=[{id:"mio"+Date.now(),nome:S.scelto.nome,kcal:S.scelto.kcal,p:S.scelto.p,c:S.scelto.c,g:S.scelto.g,porz:S.grammi}].concat(S.miei);
    salvaCfg(); S.msg="Salvato tra i miei alimenti."; render();
  }
  else if(az==="modo"){ S.modo=v; S.cerca=""; S.focus=null; render(); }
  else if(az==="man-ok"){
    S.scelto={id:"man"+Date.now(),nome:S.man.nome.trim()||"Alimento",
      kcal:Number(S.man.kcal)||0,p:Number(S.man.p)||0,c:Number(S.man.c)||0,g:Number(S.man.g)||0,porz:100};
    S.grammi=100; S.modo="cerca"; S.focus=null; render();
  }
  else if(az==="ric-add"){
    var ia=trovaPerId(b.getAttribute("data-id"));
    if(ia){ S.ric.push({nome:ia.nome,kcal:ia.kcal,p:ia.p,c:ia.c,g:ia.g,gr:ia.porz||100}); S.cerca=""; S.focus=null; render(); }
  }
  else if(az==="ric-togli"){ S.ric.splice(Number(b.getAttribute("data-i")),1); S.focus=null; render(); }
  else if(az==="ric-log"){
    var rt=ricTotali();
    if(rt.gr>0){
      aggiungiVoce({nome:S.ricNome.trim()||"Piatto composto",
        kcal:rt.kcal/rt.gr*100,p:rt.p/rt.gr*100,c:rt.c/rt.gr*100,g:rt.g/rt.gr*100},Math.round(rt.gr),S.pasto);
      S.ric=[]; S.ricNome="";
    }
  }
  else if(az==="ric-salva"){
    var rs=ricTotali();
    if(rs.gr>0){
      S.miei=[{id:"mio"+Date.now(),nome:S.ricNome.trim()||"Piatto composto",
        kcal:rs.kcal/rs.gr*100,p:rs.p/rs.gr*100,c:rs.c/rs.gr*100,g:rs.g/rs.gr*100,porz:Math.round(rs.gr)}].concat(S.miei);
      salvaCfg(); S.ric=[]; S.ricNome=""; S.msg="Piatto salvato tra i miei alimenti."; render();
    }
  }
  else if(az==="apri"){
    var d=b.getAttribute("data-d"), dove=b.getAttribute("data-dove")||"lista";
    /* Lo stesso giorno compare nel calendario e nell'elenco sotto: senza
       sapere da dove è stato toccato, la scheda si aprirebbe in due posti. */
    /* Nella striscia dei 7 giorni oggi non apre niente: chiude e riporta a
       oggi. Nel calendario dello storico invece si apre come tutti. */
    var chiude=(S.aperto===d&&S.apertoDove===dove)||(dove==="lista"&&d===S.data&&S.vista==="oggi");
    /* Chiudere il giorno vuol dire tornare a oggi: la striscia, se era
       arretrata, torna a finire su oggi insieme al resto. */
    var v=verso(S.aperto||S.data, chiude?S.data:d);
    if(chiude){S.aperto=null;S.finestra=null;}
    else apriGiorno(d,dove);
    render();
    if(S.vista==="oggi") entrata(v);
  }
  else if(az==="mese"){ S.mese=meseSposta(S.mese||meseDiOggi(),Number(v)); S.aperto=null; render(); }
  else if(az==="tema"){ S.tema=b.getAttribute("data-t"); salvaCfg(); render(); }
  else if(az==="cerchio-si"){ accendiCerchio(); }
  else if(az==="cerchio-no"){ S.cerchio=false; salvaCfg(); spegniCerchio(); render(); }
  else if(az==="togli-mio"){ var mid=b.getAttribute("data-id"); S.miei=S.miei.filter(function(m){return m.id!==mid;}); salvaCfg(); render(); }
  else if(az==="esporta"){ S.export=JSON.stringify(raccogli()); render(); }
  else if(az==="scarica"){ scaricaBackup(); }
  else if(az==="passi-si"){ passiRegistra(); }
  else if(az==="passi-no"){ passiAnnulla(); }
  else if(az==="drive-collega"){ driveSalva(true); }
  else if(az==="drive-salva"){ driveSalva(true); }
  else if(az==="drive-riprendi"){ driveRiprendi(); }
  else if(az==="drive-scollega"){ driveScollega(); }
  else if(az==="importa"){ ripristina(); }
});

/* Scorrendo il dito si cambia giorno: a sinistra il giorno dopo, a destra
   quello prima. Oltre oggi non si va — un domani da leggere non c'è — e
   indietro si arriva fino al primo giorno registrato, con la striscia che segue.

   **Riscritto il 2026-08-29 perché era inaffidabile**: lo stesso gesto, nello
   stesso punto, a volte cambiava giorno e a volte no. Due le ragioni, e valgono
   per qualunque gesto dentro una pagina che scorre:

   1. prima erano eventi "pointer" e il giorno cambiava **quando alzavi il
      dito**. Ma appena il browser decide che quel dito sta scorrendo la pagina
      manda `pointercancel`, il gesto sparisce e nessun `pointerup` arriva mai:
      bastava una punta di verticale in partenza. Adesso il gesto si riconosce
      **mentre il dito si muove**, a 60 px di corsa — quando il browser
      potrebbe ripensarci, il giorno è già cambiato. E appena il movimento è
      chiaramente orizzontale chiamiamo `preventDefault`, che è il modo di dire
      "questo dito è mio" prima che se lo prenda lui;
   2. si poteva scorrere **solo sul quadrante**, un terzo di schermo, e lui lo
      faceva anche più in basso credendo che fosse rotto. Adesso vale su tutta
      la schermata di oggi.

   Due zone restano fuori apposta: **i bordi**, 26 px per parte, da dove parte
   il gesto "indietro" di Android — rubarglielo farebbe litigare l'app col
   telefono; e tutto ciò che si tocca (caselle, pulsanti), dove il dito sta
   facendo altro. Vale con un dito solo: due dita sono una pizzicata per
   ingrandire, non uno scorrimento.

   Col mouse non funziona più, ed è voluto: sul computer i sette cerchietti si
   toccano, e tenere in piedi due strade per lo stesso gesto era una delle
   ragioni per cui questa non funzionava bene. */
/* Il rimbalzo non ridisegna niente — non è cambiato niente da disegnare —
   quindi lavora direttamente sulla pagina già in piedi. Il classList.remove più
   il offsetWidth servono a farlo ripartire anche se il dito insiste: senza,
   dalla seconda volta in poi il browser non lo rifà. */
/* Va chiamata **dopo** render(): la pagina viene rifatta da capo ogni volta,
   quindi `.corpo` di prima non esiste più. Il remove + offsetWidth serve a far
   ripartire l'animazione quando i giorni si cambiano uno dietro l'altro:
   senza, dalla seconda volta in poi il browser non la rifà. */
function entrata(verso){
  var e=document.querySelector(".corpo"); if(!e||!verso) return;
  var cl=verso>0?"entra-avanti":"entra-indietro";
  e.classList.remove("entra-avanti","entra-indietro");
  void e.offsetWidth;
  e.classList.add(cl);
  e.addEventListener("animationend",function(){ e.classList.remove(cl); },{once:true});
}
/* Da che parte si è andati, per sapere da dove far entrare il contenuto.
   Vale anche per un tocco su un cerchio lontano: conta la direzione nel tempo,
   non quanti giorni si è saltato. */
function verso(daIso,aIso){ return aIso===daIso?0:(aIso>daIso?1:-1); }
function rimbalzo(n){
  var e=document.querySelector(".corpo"); if(!e) return;
  var cl=(n>0)?"rimbalza-sx":"rimbalza-dx";
  e.classList.remove("rimbalza-sx","rimbalza-dx");
  void e.offsetWidth;
  e.classList.add(cl);
  e.addEventListener("animationend",function(){ e.classList.remove(cl); },{once:true});
}
/* Aprire un giorno vuol dire caricarne **tutto** quello che serve. Sta scritto
   qui una volta sola perché prima era in due posti: il tocco su un cerchio
   caricava voci e passi, lo scorrimento del dito solo le voci — e scorrendo, i
   passi restavano quelli del giorno di prima finché non toccavi un cerchio. */
function apriGiorno(iso,dove){
  var g=leggi(K_G+iso,{voci:[]});
  S.aperto=iso; S.apertoDove=dove||"lista";
  S.apertoVoci=g.voci||[]; S.apertoPassi=Number(g.passi)||0;
}
function giornoScorri(n){
  var oggi=oggiISO(), iso=isoSposta(S.aperto||oggi,n);
  if(iso>oggi||iso<primoGiorno()){ rimbalzo(n); return; }
  /* Se il giorno nuovo esce dalla striscia, la striscia lo segue di un passo. */
  var fine=fineFinestra();
  if(iso>fine) fine=iso;
  else if(iso<isoSposta(fine,-6)) fine=isoSposta(iso,6);
  S.finestra=(fine>=oggi)?null:fine;
  if(iso===oggi) S.aperto=null; else apriGiorno(iso);
  /* la palestra si rilegge qui: se ti sei allenato mentre il Diario era già
     aperto, arrivando su quel giorno il riquadro sarebbe rimasto vuoto */
  leggiPalestra();
  render();
  entrata(n);
}

var CORSA=60, BORDO=26;
var gesto=null;
function suUnComando(t){
  return !!(t&&t.closest&&t.closest("input,textarea,select,button,label,a"));
}
document.getElementById("app").addEventListener("touchstart",function(ev){
  gesto=null;
  if(S.vista!=="oggi"||ev.touches.length!==1) return;
  var t=ev.touches[0];
  if(t.clientX<BORDO||t.clientX>window.innerWidth-BORDO) return;
  if(suUnComando(ev.target)) return;
  gesto={x:t.clientX,y:t.clientY,dir:0,fatto:false};
},{passive:true});
document.getElementById("app").addEventListener("touchmove",function(ev){
  if(!gesto||gesto.fatto||ev.touches.length!==1) return;
  var t=ev.touches[0], dx=t.clientX-gesto.x, dy=t.clientY-gesto.y;
  if(!gesto.dir){
    /* verticale: è la pagina che scorre, e allora questo gesto non è nostro */
    if(Math.abs(dy)>10&&Math.abs(dy)>=Math.abs(dx)){ gesto=null; return; }
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)) gesto.dir=1; else return;
  }
  if(ev.cancelable) ev.preventDefault();
  if(Math.abs(dx)>=CORSA){ gesto.fatto=true; giornoScorri(dx<0?1:-1); }
},{passive:false});
document.getElementById("app").addEventListener("touchend",function(){ gesto=null; },{passive:true});
document.getElementById("app").addEventListener("touchcancel",function(){ gesto=null; },{passive:true});

/* Ripristino da file: incollare il testo di un backup è scomodo su un
   computer, e serve proprio quando si vuole rivedere il diario altrove. */
document.getElementById("app").addEventListener("change",function(ev){
  var e=ev.target;
  if(e.getAttribute("data-in")!=="file-backup") return;
  var f=e.files&&e.files[0]; if(!f) return;
  var lettore=new FileReader();
  lettore.onload=function(){ S.importa=String(lettore.result||""); ripristina(); };
  lettore.onerror=function(){ S.msg="Non sono riuscito a leggere quel file."; render(); };
  lettore.readAsText(f);
});

document.getElementById("app").addEventListener("input",function(ev){
  var e=ev.target, k=e.getAttribute("data-in"); if(!k) return;
  S.focus=k;
  if(k==="cerca"){ S.cerca=e.value; render(); }
  else if(k==="grammi"){ S.grammi=Math.max(0,Number(e.value)); render(); }
  else if(k==="passi"){ S.passi=Math.max(0,Math.round(Number(e.value)||0)); salva(); render(); }
  else if(k==="importa"){ S.importa=e.value; }
  else if(k==="ricNome"){ S.ricNome=e.value; }
  else if(k.indexOf("ric")===0){ var i=Number(k.slice(3)); if(S.ric[i]){S.ric[i].gr=Number(e.value)||0; render();} }
  else if(k.indexOf("man-")===0){ S.man[k.slice(4)]=e.value; }
  else if(k.indexOf("ob-")===0){ S.ob[k.slice(3)]=Number(e.value)||0; salvaCfg(); }
});

/* ---------- backup ---------- */
function raccogli(){
  var out={versione:1,ob:S.ob,miei:S.miei,indice:S.indice,giorni:{}};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(K_G)===0) out.giorni[k.slice(K_G.length)]=leggi(k,null);
  }
  return out;
}
function scaricaBackup(){
  try{
    var testo=JSON.stringify(raccogli(),null,1);
    var blob=new Blob([testo],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="diario-"+oggiISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    S.msg="File scaricato."; render();
  }catch(e){ S.msg="Scaricamento non riuscito. Usa il testo da copiare."; render(); }
}
function ripristina(){
  try{
    var d=JSON.parse(S.importa);
    if(!d.giorni) throw new Error("formato");
    Object.keys(d.giorni).forEach(function(k){ scrivi(K_G+k,d.giorni[k]); });
    if(d.indice) scrivi(K_IDX,d.indice);
    /* Niente fabV qui apposta: un backup di prima del 2026-08-21 riporta il
       fabbisogno a 2500, e al riavvio la conversione lo rimette a 2200. */
    if(d.ob||d.miei) scrivi(K_CFG,{ob:d.ob||S.ob,miei:d.miei||S.miei,recenti:S.recenti,tema:S.tema,drive:S.drive});
    S.importa=""; S.msg="Ripristinato. Ricarico…";
    render(); setTimeout(function(){location.reload();},900);
  }catch(e){ S.msg="Quel testo non è un backup valido."; render(); }
}

/* ---------- copia di sicurezza su Google Drive ----------
   Il diario vive solo dentro questo telefono: se si rompe, è finita. Qui la
   copia va nel Drive di Manlio, in un file che lui vede e può scaricare.

   Tre cose da non rovinare, in ordine di importanza:

   1. **L'app deve continuare ad aprirsi senza rete.** Il pezzetto di Google
      si scarica da Google, quindi si carica SOLO quando serve — mai all'avvio,
      mai come dipendenza della pagina. Se la rete non c'è, qui fallisce tutto
      in silenzio e il diario funziona come sempre.
   2. **Il permesso vive solo in memoria** (`GTOK`): non finisce in
      localStorage, scade da solo dopo un'ora e si richiede quando serve.
   3. Il permesso chiesto è `drive.file`: l'app può toccare **soltanto il file
      che ha creato lei**. Del resto del Drive non vede nemmeno l'esistenza.
      Non allargare questo permesso: è la ragione per cui Google non pretende
      di esaminare l'app. */
var GOOGLE_ID="1065080427514-4ahoui2pq52jd74lvl6f9d5rbnpigc7h.apps.googleusercontent.com";
var GOOGLE_AMBITO="https://www.googleapis.com/auth/drive.file";
var DRIVE_NOME="diario-backup.json";
var GTOK=null, gsi=null, clienteTok=null, attesaTok=null, tDrive=null;

function caricaGsi(){
  if(window.google&&window.google.accounts&&window.google.accounts.oauth2) return Promise.resolve();
  if(gsi) return gsi;
  gsi=new Promise(function(ok,no){
    var e=document.createElement("script");
    e.src="https://accounts.google.com/gsi/client"; e.async=true; e.defer=true;
    e.onload=function(){ ok(); };
    e.onerror=function(){ gsi=null; no(erroreDrive("rete")); };
    document.head.appendChild(e);
  });
  return gsi;
}
function erroreDrive(tipo,stato){ var e=new Error(tipo); e.tipo=tipo; e.stato=stato||0; return e; }

/* chiede il permesso: "interattivo" apre la finestra di Google, altrimenti
   prova in silenzio e fallisce senza disturbare */
function permessoDrive(interattivo){
  if(GTOK) return Promise.resolve(GTOK);
  return caricaGsi().then(function(){
    if(!clienteTok){
      clienteTok=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_ID, scope:GOOGLE_AMBITO,
        callback:function(r){
          var a=attesaTok; attesaTok=null;
          if(r&&r.access_token){ GTOK=r.access_token; if(a) a.ok(GTOK); }
          else if(a) a.no(erroreDrive("permesso"));
        },
        error_callback:function(){ var a=attesaTok; attesaTok=null; if(a) a.no(erroreDrive("permesso")); }
      });
    }
    return new Promise(function(ok,no){
      attesaTok={ok:ok,no:no};
      try{ clienteTok.requestAccessToken({prompt:interattivo?"consent":""}); }
      catch(e){ attesaTok=null; no(erroreDrive("permesso")); }
    });
  });
}

function chiamaDrive(tok,url,opz){
  opz=opz||{}; opz.headers=opz.headers||{};
  opz.headers.Authorization="Bearer "+tok;
  return fetch(url,opz).then(function(r){
    if(r.status===401||r.status===403) throw erroreDrive("scaduto",r.status);
    if(!r.ok) throw erroreDrive("errore",r.status);
    return r;
  },function(){ throw erroreDrive("rete"); });
}
function driveCerca(tok){
  var q="name='"+DRIVE_NOME+"' and trashed=false";
  return chiamaDrive(tok,"https://www.googleapis.com/drive/v3/files?spaces=drive&pageSize=1&fields=files(id)&q="+encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(d){ return (d.files&&d.files[0])?d.files[0].id:null; });
}
function driveScrivi(tok,id,testo){
  if(id) return chiamaDrive(tok,"https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media&fields=id,modifiedTime",
      {method:"PATCH",headers:{"Content-Type":"application/json"},body:testo})
      .then(function(r){ return r.json(); }).then(function(d){ return {id:id,rev:d.modifiedTime}; });
  var linea="-diario-"+Date.now();
  var corpo="--"+linea+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+
            JSON.stringify({name:DRIVE_NOME,mimeType:"application/json"})+
            "\r\n--"+linea+"\r\nContent-Type: application/json\r\n\r\n"+testo+"\r\n--"+linea+"--";
  return chiamaDrive(tok,"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime",
      {method:"POST",headers:{"Content-Type":"multipart/related; boundary="+linea},body:corpo})
    .then(function(r){ return r.json(); }).then(function(d){ return {id:d.id,rev:d.modifiedTime}; });
}
function driveQuandoTocca(tok,id){
  return chiamaDrive(tok,"https://www.googleapis.com/drive/v3/files/"+id+"?fields=modifiedTime")
    .then(function(r){ return r.json(); }).then(function(d){ return d.modifiedTime; });
}
function driveLeggi(tok,id){
  return chiamaDrive(tok,"https://www.googleapis.com/drive/v3/files/"+id+"?alt=media").then(function(r){ return r.text(); });
}

/* Un diario vuoto non è una copia: è la mancanza di una copia. */
function diarioVuoto(){ return Object.keys(S.indice).length===0&&S.voci.length===0; }

/* Il salvataggio vero. "interattivo" è vero solo quando è stato lui a
   chiederlo: in quel caso può comparire la finestra di Google, e gli errori
   glieli mostriamo. In automatico invece tutto avviene in silenzio.

   **La regola che conta: se qui il diario è vuoto, non si scrive su Drive.**
   Il caso da temere è proprio quello per cui esiste tutta questa funzione —
   telefono nuovo, diario ancora vuoto, lui che tocca "Collega" per primo: senza
   questo blocco, il vuoto di qui cancellerebbe la copia buona di là, e non ci
   sarebbe più nessun posto da cui riprenderla. In quel caso ci colleghiamo, ma
   invece di salvare gli diciamo di premere "Riprendi". */
function driveSalva(interattivo){
  if(!interattivo&&!S.drive.on) return Promise.resolve();
  if(!interattivo&&diarioVuoto()) return Promise.resolve();
  clearTimeout(tDrive); tDrive=null;
  S.driveStato="corso"; if(S.vista==="impostazioni") render();
  var riprovato=false;
  function giro(){
    return permessoDrive(interattivo&&!GTOK).then(function(tok){
      var p=S.drive.id?Promise.resolve(S.drive.id):driveCerca(tok);
      return p.then(function(id){
        if(diarioVuoto()){ return {fermo:true, id:id}; }
        if(!id) return driveScrivi(tok,null,JSON.stringify(raccogli()));
        /* Chi ha toccato quel file per ultimo? Se non siamo stati noi, di là c'è
           roba più nuova — un altro dispositivo — e sovrascriverla la
           cancellerebbe in silenzio. Meglio fermarsi e dirglielo.
           `rev` mancante = copia fatta prima di questo controllo: la si accetta
           una volta sola e da lì in poi il segnaposto c'è. */
        return driveQuandoTocca(tok,id).then(function(rev){
          if(S.drive.rev&&rev&&rev!==S.drive.rev) return {fermo:true, id:id, altrove:true};
          return driveScrivi(tok,id,JSON.stringify(raccogli()));
        });
      });
    });
  }
  return giro().catch(function(e){
    /* un permesso scaduto è la cosa più normale del mondo: si rifà e basta */
    if(e.tipo==="scaduto"&&!riprovato){ riprovato=true; GTOK=null; return giro(); }
    throw e;
  }).then(function(r){
    S.drive.on=true; S.drive.id=r.id||S.drive.id;
    if(r.fermo){ S.driveStato=r.altrove?"altrove":(r.id?"riprendi":"quivuoto"); }
    else { S.drive.rev=r.rev||null; S.drive.ultimo=Date.now(); S.driveStato="fatto"; }
    salvaCfg(); if(S.vista==="impostazioni") render();
  }).catch(function(e){
    S.driveStato=(e.tipo==="permesso"||e.tipo==="scaduto")?"permesso":(e.tipo==="rete"?"rete":"errore");
    if(S.vista==="impostazioni") render();
  });
}

/* Riprendere: il file di Drive prende il posto di quello che c'è qui, con la
   stessa strada del ripristino da file — così esiste un solo modo di rimettere
   dentro i dati, già collaudato. */
function driveRiprendi(){
  S.driveStato="corso"; render();
  permessoDrive(!GTOK).then(function(tok){
    var p=S.drive.id?Promise.resolve(S.drive.id):driveCerca(tok);
    return p.then(function(id){
      if(!id) throw erroreDrive("vuoto");
      S.drive.id=id;
      return driveQuandoTocca(tok,id).then(function(rev){
        S.drive.rev=rev||null; S.drive.on=true; salvaCfg();
        return driveLeggi(tok,id);
      });
    });
  }).then(function(testo){
    S.driveStato=""; S.importa=testo; ripristina();
  }).catch(function(e){
    S.driveStato=e.tipo==="vuoto"?"vuoto":(e.tipo==="rete"?"rete":"permesso");
    render();
  });
}
function driveScollega(){
  try{ if(GTOK&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(GTOK); }catch(e){}
  GTOK=null; S.drive={on:false,id:null,ultimo:null,rev:null}; S.driveStato="";
  salvaCfg(); render();
}
/* Dopo una voce nuova aspettiamo un minuto prima di risalire su Drive: se sta
   registrando la cena, riscriverebbe il file cinque volte in due minuti. */
function driveFraPoco(){
  if(!S.drive.on) return;
  clearTimeout(tDrive);
  tDrive=setTimeout(function(){ driveSalva(false); },60000);
}
function quandoSalvato(ts){
  if(!ts) return "mai";
  var d=new Date(ts), iso=d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
  var ora=p2(d.getHours())+":"+p2(d.getMinutes());
  if(iso===oggiISO()) return "oggi alle "+ora;
  if(iso===isoSposta(oggiISO(),-1)) return "ieri alle "+ora;
  return dataEstesa(iso)+" alle "+ora;
}

/* Ad app già aperta il telefono non ricarica niente, cambia solo l'indirizzo:
   senza questo, i passi mandati dal contapassi non comparirebbero mai. */
window.addEventListener("hashchange",function(){
  var m=leggiMessaggioPassi();
  if(m){ S.daContapassi=m; render(); }
});

/* ---------- avvio + funzionamento offline ---------- */
avvia();
/* La copia all'apertura parte staccata dall'avvio e in ritardo: se Google non
   risponde, o non c'è rete, l'app è già in piedi e non se ne accorge nessuno. */
if(S.drive.on) setTimeout(function(){ driveSalva(false); },2000);
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
