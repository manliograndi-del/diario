<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141B18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diario">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --carta:#E9ECE6; --superficie:#FFFFFF; --inchiostro:#141B18; --tenue:#5B6661;
  --linea:#CDD3CB; --blu:#1F4A6B; --senape:#C08411; --rosso:#A3341F; --verde:#2E6B4F;
  /* su-inchiostro: il testo sopra i fondi color inchiostro. Nel tema scuro
     l'inchiostro diventa chiaro, quindi questo deve diventare scuro. */
  --su-inchiostro:#F2F5F1;
  --traccia:#E4E8E1;      /* il grigio delle piste vuote: anelli e nastri */
  --neutro:#7A8A84;       /* le barrette dei macro */
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --testo:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
}
/* Tema scuro: cambiano solo i neutri e la luminosità dei colori dei dati.
   Blu = calorie, senape = proteine, verde/rosso = grasso continuano a voler
   dire la stessa cosa, altrimenti i numeri smetterebbero di parlare. */
:root[data-tema="scuro"]{
  --carta:#121614; --superficie:#1B211E; --inchiostro:#E6EBE7; --tenue:#96A29C;
  --linea:#2F3936; --blu:#6FA8CE; --senape:#D9A441; --rosso:#D9694B; --verde:#4E9A72;
  --su-inchiostro:#121614;
  --traccia:#2A322F;
  --neutro:#6E7C77;
}
html{background:var(--carta)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--testo); background:var(--carta); color:var(--inchiostro);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
#app{max-width:560px;margin:0 auto;padding:0 0 86px}

/* testata */
.testata{padding:calc(20px + env(safe-area-inset-top)) 18px 12px}
.testata-riga{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.testata-riga>div{min-width:0}
.occhiello{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue);margin-bottom:4px}
/* Titolo e data sulla stessa riga: se la data andasse a capo, la testata
   cambierebbe altezza da una schermata all'altra e tutto quello che sta sotto
   — cerchi compresi — salterebbe su e giù a ogni cambio di giorno. */
.data-titolo{font-size:34px;font-weight:800;line-height:1.05;margin:0;letter-spacing:-.03em;
  display:flex;align-items:baseline;gap:9px;white-space:nowrap;min-width:0}
.titolo-lato{font-size:13px;font-weight:400;letter-spacing:0;color:var(--tenue);
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.spia{font-family:var(--mono);font-size:10.5px;color:var(--tenue);padding-top:6px;letter-spacing:.04em}
.spia.errore{color:var(--rosso)}

.avviso{margin:0 18px 12px;padding:11px 13px;background:var(--inchiostro);color:var(--su-inchiostro);font-size:13px;border-radius:3px;display:flex;justify-content:space-between;gap:10px}
.avviso b{font-weight:600}
.avviso-x{font-family:var(--mono);font-size:10.5px;opacity:.65;white-space:nowrap}

.corpo{padding:0 18px;display:flex;flex-direction:column;gap:12px}

/* pannelli */
.pannello{background:var(--superficie);border:1px solid var(--linea);border-radius:3px;padding:16px}
.pannello.mini{padding:13px}
.coppia{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* senza questo le due carte si allargano per stare dietro al contenuto e la
   pagina scorre di lato: nella griglia il minimo di una colonna è il suo
   contenuto, non zero. */
.coppia>*{min-width:0}
.p-testa{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p-piede{font-size:12.5px;color:var(--tenue);margin-top:11px}
.etichetta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.etichetta.sopra{margin-top:20px;display:block}
.mini-et{font-size:11.5px;color:var(--tenue);margin-bottom:4px}
.cifra-g{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.cifra-m{font-size:22px;font-weight:700;margin:6px 0 9px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.unita{font-weight:400;font-size:13px;color:var(--tenue);letter-spacing:0}
.rossa{color:var(--rosso)}

.nastro{height:9px;background:var(--traccia);border:1px solid var(--linea);border-radius:1px;margin-top:14px;overflow:hidden}
.nastro.sottile{height:6px;margin-top:4px}
.nastro i{display:block;height:100%;background:var(--blu);transition:width .35s cubic-bezier(.2,.7,.3,1)}
.nastro i.neutro{background:var(--neutro)}
.nastro i.oltre{background:var(--rosso)}

.b1{width:100%;background:var(--inchiostro);color:var(--su-inchiostro);padding:15px;border-radius:3px;font-size:15px;font-weight:600;margin-top:16px}
.b1:active{transform:scale(.985)}
.b1:disabled{opacity:.45}
.b2{width:100%;background:transparent;padding:13px;border:1px solid var(--inchiostro);border-radius:3px;font-size:14px;font-weight:500;margin-top:9px}
label.b2{display:block;text-align:center;cursor:pointer}
label.b2:active{background:var(--inchiostro);color:var(--su-inchiostro)}
.file-nascosto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.indietro{font-size:13.5px;color:var(--tenue);padding:6px 0;text-align:left;display:block}

/* elenchi */
.gruppo{margin-top:6px}
.g-testa{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 8px;border-bottom:1px solid var(--linea)}
.g-titolo{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.g-kcal{font-family:var(--mono);font-size:12px;color:var(--tenue)}
.voce{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--linea)}
.v-corpo{flex:1;min-width:0}
.v-nome{font-size:14.5px;font-weight:500}
.v-dati{font-family:var(--mono);font-size:11px;color:var(--tenue);margin-top:3px}
.v-togli{font-family:var(--mono);font-size:10.5px;color:var(--tenue);border:1px solid var(--linea);border-radius:2px;padding:6px 9px;flex-shrink:0}
.v-togli:active{background:var(--rosso);color:var(--superficie);border-color:var(--rosso)}
.vuoto{background:var(--superficie);border:1px dashed var(--linea);border-radius:3px;padding:20px;font-size:14px;color:var(--tenue);line-height:1.55}

/* campi */
.modi{display:flex;gap:6px}
.modo{flex:1;padding:10px 4px;font-size:13px;font-weight:500;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);color:var(--tenue)}
.modo.on{background:var(--inchiostro);color:var(--su-inchiostro);border-color:var(--inchiostro)}
.cerca{width:100%;padding:14px;font-size:16px;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);color:var(--inchiostro)}
.campo{width:100%;padding:12px;font-size:15px;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);color:var(--inchiostro);margin-top:8px;resize:vertical}
.campo.export{font-family:var(--mono);font-size:10.5px}
input:focus,textarea:focus{outline:2px solid var(--blu);outline-offset:1px}
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.griglia .campo{margin-top:0}

.riga-al{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--linea);text-align:left}
.r-nome{font-size:14.5px}
.r-kcal{font-family:var(--mono);font-size:11px;color:var(--tenue);white-space:nowrap}
.tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--linea);border-radius:2px;padding:1px 4px;margin-left:7px;color:var(--tenue)}

.t-scelto{font-size:21px;font-weight:700;margin:7px 0 5px;letter-spacing:-.02em}
.base{font-family:var(--mono);font-size:11px;color:var(--tenue)}
.qta{display:flex;align-items:center;gap:9px;margin-top:9px}
.passo{width:56px;padding:13px 0;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);font-size:15px;font-weight:600}
.passo:active{background:var(--inchiostro);color:var(--su-inchiostro)}
.campo-qta{flex:1;padding:13px;font-size:19px;font-weight:700;text-align:center;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);color:var(--inchiostro);min-width:0}
.u{font-size:14px;color:var(--tenue)}
/* Le due carte di quello che hai bruciato, affiancate come Carboidrati e
   Grassi: il cerchio dice a occhio quanto, il numero dice quanto esattamente. */
.brucia .br-riga{display:flex;align-items:center;gap:10px;margin-top:9px}
.br-svg{width:46px;height:46px;flex:none}
.br-txt{min-width:0}
.br-n{font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.02em;white-space:nowrap;color:var(--verde)}
.br-n.spenta{color:var(--tenue)}
.br-n .unita{font-size:11px;font-weight:500;color:var(--tenue);letter-spacing:0}
.br-sotto{font-size:11.5px;color:var(--tenue);margin-top:4px;line-height:1.3}
.br-u{font-size:11.5px;color:var(--tenue)}
.br-in{width:4.6ch;padding:0 0 1px;border:0;border-bottom:1.5px solid var(--linea);border-radius:0;
  background:transparent;color:var(--inchiostro);font-family:inherit;font-size:12.5px;font-weight:700;
  -webkit-appearance:none;appearance:none}
.br-in:focus{outline:none;border-bottom-color:var(--blu)}
.br-coda{font-size:11px;color:var(--tenue);margin-top:9px;line-height:1.3}
.nota-coppia{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{padding:8px 12px;border:1px solid var(--linea);border-radius:20px;font-size:13px;background:var(--superficie)}
.chip.on{background:var(--inchiostro);color:var(--su-inchiostro);border-color:var(--inchiostro)}
.ant{margin-top:16px;padding:13px;background:var(--carta);border-radius:3px;border:1px solid var(--linea)}
.ant-k{font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ant-m{font-family:var(--mono);font-size:11.5px;color:var(--tenue);margin-top:4px}
.nota{font-size:12.5px;color:var(--tenue);line-height:1.55;margin-top:10px}
.errore{font-size:13px;color:var(--rosso);margin-top:10px}

/* ricetta */
.ing{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--linea)}
.ing-n{flex:1;font-size:14px;min-width:0}
.ing-g{width:74px;padding:9px;text-align:center;font-size:15px;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);color:var(--inchiostro)}

/* storico: riepilogo del mese */
.mese-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px}
.mese-t{font-size:20px;font-weight:800;letter-spacing:-.025em}
.frec{width:46px;height:40px;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);color:var(--inchiostro);font-size:17px;font-weight:700}
.frec:active{background:var(--inchiostro);color:var(--su-inchiostro)}
.frec:disabled{opacity:.28}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.2fr;gap:3px;margin-top:14px}
.cal-l{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--tenue);text-align:center;padding-bottom:3px}
.cal-g{min-height:44px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cal-g b{font-family:var(--mono);font-size:9px;font-weight:400;line-height:1;color:var(--tenue)}
/* i grammi: sono loro il messaggio, il numero del giorno è solo l'etichetta */
.cal-g em,.cal-w em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.cal-g em{font-size:11px}
.gi{color:var(--verde)}
.gu{color:var(--rosso)}
.cal-g.spenta{background:var(--traccia);border:1px solid var(--linea)}
.cal-g.vuota{background:none}
.cal-g.dato{background:var(--superficie);border:1px solid var(--inchiostro)}
.cal-g.dato:active,.cal-g.dato.on{background:var(--inchiostro);border-color:var(--inchiostro)}
/* sul fondo scuro il verde e il rosso non si leggerebbero più */
.cal-g.dato:active b,.cal-g.dato:active em,.cal-g.dato.on b,.cal-g.dato.on em{color:var(--su-inchiostro)}
.cal-g.oggi{outline:2px solid var(--senape);outline-offset:-2px}
/* la colonna dei totali di settimana, in fondo a ogni riga */
.cal-w{min-height:44px;border-radius:3px;background:var(--traccia);display:flex;align-items:center;justify-content:center}
.cal-w em{font-size:10px}
.mese-num{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--linea)}
.mese-num .cifra-m{margin:5px 0 0}
.mese-grasso{margin-top:16px;padding:14px;background:var(--carta);border:1px solid var(--linea);border-radius:3px}
.mese-grasso .cifra-g{margin-top:7px}

/* storico */
.grafico{display:flex;gap:4px;align-items:flex-end;height:140px;margin-top:14px;position:relative}
.col{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.col-c{flex:1;display:flex;align-items:flex-end}
.col-b{width:100%;background:var(--blu);border-radius:1px 1px 0 0}
.col-b.oltre{background:var(--rosso)}
.col-e{font-family:var(--mono);font-size:8.5px;color:var(--tenue);text-align:center;padding-top:5px;white-space:nowrap;overflow:hidden}
.obiettivo{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--senape);pointer-events:none}
.giorno{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--linea);text-align:left}
.gg-d{font-size:14.5px;font-weight:500}
.gg-m{font-family:var(--mono);font-size:10.5px;color:var(--tenue);margin-top:3px}
.gg-k{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dett{padding:9px 2px 13px}

/* navigazione */
.barra{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--superficie);border-top:1px solid var(--linea);max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.b-voce{flex:1;padding:15px 4px;font-size:12px;color:var(--tenue);border-top:2px solid transparent;margin-top:-1px;font-weight:500}
.b-voce.on{color:var(--inchiostro);border-top-color:var(--inchiostro);font-weight:700}


/* quadrante */
/* pan-y: lo scorrimento verticale della pagina resta al browser, quello
   orizzontale arriva a noi e diventa il cambio di giorno.
   user-select: senza, un dito che parte sopra un numero fa partire il
   trascinamento del testo, il browser manda pointercancel e il giorno non
   cambia. Succedeva solo su certi giorni, dove al centro capitava una scritta
   invece del disegno: il difetto peggiore, quello che sembra capriccio. */
.quadrante{padding:20px 16px 16px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.quad-riga{display:flex;align-items:center;justify-content:center;gap:16px}
.anelli-box{position:relative;display:flex;justify-content:center;align-items:center;flex-shrink:0}
.grasso{display:flex;flex-direction:column;align-items:center;gap:9px;flex:0 1 118px;min-width:74px}
.grasso-svg{width:100%;height:auto;display:block}
.grasso-c{transition:r .5s cubic-bezier(.2,.7,.3,1),fill .5s}
.grasso-n{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.quad-testa{margin-bottom:15px;min-height:25px;align-items:center}
.col-cap{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);text-align:center;line-height:1.35}
.anelli{display:block}
.arco{transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.3,1)}
.centro{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.c-kcal{font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;color:var(--blu)}
.c-sotto{font-size:10px;color:var(--tenue);margin-top:4px;max-width:104px;line-height:1.3}
.c-prot{margin-top:9px;font-size:15px;font-weight:700;color:var(--senape);font-variant-numeric:tabular-nums;max-width:112px;white-space:nowrap}
.c-prot span{font-size:11px;font-weight:400;color:var(--tenue)}
.legenda{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:14px}
.lg{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tenue)}
.pt{width:9px;height:9px;border-radius:50%;display:inline-block}
.pt.blu{background:var(--blu)}
.pt.sen{background:var(--senape)}
.pt.ros{background:var(--rosso)}
.due-cifre{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:15px;border-top:1px solid var(--linea)}
.due-cifre .cifra-m{margin:5px 0 0}

/* striscia settimana */
.settimana{display:flex;justify-content:space-between;gap:2px;margin-top:14px}
.sg{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
.sg-anello{line-height:0}
.sg-anello.spento{opacity:.32}
.sg-l{font-family:var(--mono);font-size:10.5px;color:var(--tenue);border-bottom:2px solid transparent;padding-bottom:2px}
.sg.oggi .sg-l{color:var(--inchiostro);font-weight:700}
button.sg{padding:2px 0}
.sg.on .sg-l{color:var(--inchiostro);font-weight:700;border-bottom-color:var(--inchiostro)}

/* scheda di un giorno passato */
.sc-chiudi{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);border:1px solid var(--linea);border-radius:2px;padding:5px 9px}
.sc-chiudi:active{background:var(--inchiostro);color:var(--su-inchiostro);border-color:var(--inchiostro)}
.sc-tot{margin-top:0;padding-top:13px}
.sc-macro{font-family:var(--mono);font-size:11px;color:var(--tenue);margin-top:11px}
.sc-gruppo{margin-top:12px}
.sc-vuoto{font-size:13.5px;color:var(--tenue);line-height:1.55;margin-top:11px}
.dett-r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--linea)}

/* Qui c'era la transizione del cambio giorno, provata il 2026-08-22 e tolta lo
   stesso giorno: a Manlio sembrava un salto anche rallentata. Il giorno nuovo
   compare e basta. Non rimetterla senza che la chieda lui.
   Il rimbalzo qui sotto è un'altra cosa e l'ha chiesto lui: non accompagna un
   cambio di pagina, risponde a un gesto che non può andare da nessuna parte —
   oltre oggi, o prima del primo giorno registrato. Senza, il dito scorreva e
   non succedeva niente, che sembra un guasto. */
@keyframes rimbalzo-sx{40%{transform:translateX(-13px)}100%{transform:none}}
@keyframes rimbalzo-dx{40%{transform:translateX(13px)}100%{transform:none}}
.rimbalza-sx{animation:rimbalzo-sx .3s cubic-bezier(.3,0,.3,1)}
.rimbalza-dx{animation:rimbalzo-dx .3s cubic-bezier(.3,0,.3,1)}
/* Il cambio di giorno: il contenuto entra dal lato da cui viene, sedici pixel
   e un velo di trasparenza, in un quinto di secondo. Non è la transizione di
   agosto, quella che lui aveva bocciato dicendo "mi sembra proprio che faccia
   un salto": lì la pagina scivolava via intera e ne arrivava un'altra, e per
   farlo bene servirebbero due copie della pagina alla volta. Qui la pagina è
   una sola, già disegnata coi numeri nuovi, e si limita ad assestarsi. Sedici
   pixel e non di più: deve dire da che parte sei andato, non farsi guardare. */
@keyframes entra-avanti{from{transform:translateX(16px);opacity:.45}to{transform:none;opacity:1}}
@keyframes entra-indietro{from{transform:translateX(-16px);opacity:.45}to{transform:none;opacity:1}}

.entra-indietro{animation:entra-indietro .19s cubic-bezier(.2,.7,.3,1)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- costanti e utilità ---------- */
var K_CFG="diario.config", K_IDX="diario.indice", K_G="diario.g.";
/* Sola lettura: il Diario guarda l'indice della Palestra, non lo scrive mai.
   Le due app vivono sullo stesso indirizzo e dividono lo stesso localStorage:
   il prefisso è tutta la separazione che c'è. */

var OB_DEF={kcal:1500,fab:2200,p:160,c:120,g:45,peso:97};
/* Il fabbisogno è sceso da 2500 a 2200 il 2026-08-21, chiesto da Manlio.
   Cambiare la costante non basta: chi usa già l'app ha il vecchio numero
   salvato in diario.config e continuerebbe a vedere 2500. FAB_V fa la

   fabbrica: un numero scelto a mano non si tocca mai.
   Il numero raggiunto va scritto anche da salvaCfg(), altrimenti la

var FAB_V=1, FAB_VECCHIO=2500, FAB_NUOVO=2200;
var PASTI=["Colazione","Pranzo","Cena","Spuntino"];
var GG=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
var MM=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

function p2(n){return String(n).padStart(2,"0");}
function oggiISO(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function oraOra(){var d=new Date();return p2(d.getHours())+":"+p2(d.getMinutes());}
function pastoDaOra(){var h=new Date().getHours();return h<11?"Colazione":h<15?"Pranzo":h<18?"Spuntino":"Cena";}
function num(v,dec){var n=Number(v)||0;return n.toFixed(dec||0).replace(".",",");}
/* I nomi dei giorni escono minuscoli da GG: in cima alla pagina, dove sono un
   titolo, la maiuscola ci vuole. */
function maiuscola(t){ return t?t.charAt(0).toUpperCase()+t.slice(1):t; }
function dataEstesa(iso){var a=iso.split("-").map(Number);var d=new Date(a[0],a[1]-1,a[2]);return GG[d.getDay()]+" "+d.getDate()+" "+MM[d.getMonth()];}
function dataBreve(iso){var a=iso.split("-");return Number(a[2])+"/"+Number(a[1]);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------- tema chiaro / scuro ----------
   "auto" accende lo scuro dalle 20 alle 7. Non seguiamo l'impostazione del
   telefono: chi la tiene sempre su chiaro non vedrebbe mai cambiare niente e
   penserebbe che la funzione sia rotta. L'ora invece si comporta sempre. */
var ORA_BUIO=20, ORA_LUCE=7;
function temaScuro(){
  if(S.tema==="scuro") return true;
  if(S.tema==="chiaro") return false;
  var h=new Date().getHours();
  return h>=ORA_BUIO||h<ORA_LUCE;
}
var temaMesso=null;
function applicaTema(){
  var scuro=temaScuro();
  document.documentElement.setAttribute("data-tema",scuro?"scuro":"chiaro");
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",scuro?"#121614":"#141B18");
  var cambiato=temaMesso!==null&&temaMesso!==scuro;
  temaMesso=scuro;
  return cambiato;
}

/* ---------- memoria: localStorage ---------- */
var memOk=true;
function leggi(k,def){

}
function scrivi(k,v){

var S={

           if(cfg.drive) S.drive=Object.assign({on:false,id:null,ultimo:null,rev:null},cfg.drive);
           if(cfg.tema==="chiaro"||cfg.tema==="scuro"||cfg.tema==="auto") S.tema=cfg.tema;

/* ---------- il cerchio nella barra in alto ----------
   Chiesto il 2026-08-28: un cerchio che si riempie man mano che le calorie
   della giornata si avvicinano all'obiettivo, visibile in cima allo schermo
   senza aprire niente.

   Come funziona davvero: una pagina web non può disegnare nella barra di
   stato di Android, ma **una notifica sì**. L'icona piccola di una notifica —
   il `badge` — è esattamente quel disegno lassù. Quindi il cerchio è una
   notifica silenziosa che resta lì e che riscriviamo, sempre con la stessa
   `tag`, ogni volta che il numero cambia.

   Android della `badge` usa **solo il canale alfa** e colora tutto di bianco:
   niente colori, niente rosso quando si sfora. Per questo i cerchi sono 21
   immagini già pronte in `badge/` (una ogni 5%, più quella "oltre"), disegnate
   con il contorno in mezza trasparenza e la fetta piena. Un canvas al volo non
   servirebbe: le immagini della notifica le carica il browser da un indirizzo,
   e così funzionano anche senza rete perché il service worker le ha in cache.

   **Si aggiorna quando l'app è aperta**, cioè quando il numero cambia davvero:
   quando segni qualcosa e quando apri il Diario. Senza un server che spinga le
   notifiche non c'è modo di aggiornarlo a app chiusa — e non serve, perché a
   app chiusa il numero non cambia. L'unico caso vero è la mezzanotte: il
   cerchio resta pieno di ieri finché non riapri l'app. */
var CERCHIO_TAG="calorie";
function p3(n){ n=String(n); while(n.length<3) n="0"+n; return n; }
function cerchioFile(q){
  if(q>1.0001) return "badge/cerchio-oltre.png";
  if(q<0) q=0;
  return "badge/cerchio-"+p3(Math.round(q*20)*5)+".png";
}
function cerchioSiPuo(){ return ("Notification" in window) && !!navigator.serviceWorker; }
/* I colori del disegno li manda la pagina, letti dalle variabili CSS vere che
   sta usando adesso: così il service worker non ne tiene una copia sua che si
   scollerebbe alla prima modifica, e il tema chiaro o scuro viene dietro da
   solo senza doverlo dire. */
function tintePerIlDisegno(){
  var st=getComputedStyle(document.documentElement);
  return ["--carta","--inchiostro","--tenue","--traccia","--blu","--senape","--rosso"]
    .map(function(n){ return (st.getPropertyValue(n)||"").trim().replace("#",""); })
    .join(",");
}
function aggiornaCerchio(){
  if(!S.cerchio||!cerchioSiPuo()||Notification.permission!=="granted") return;
  var t=totali(S.voci), ob=Math.max(1,S.ob.kcal), q=t.kcal/ob, rest=S.ob.kcal-t.kcal;
  /* L'indirizzo del disegno: non è un file, lo compone il service worker sui
     numeri che gli passiamo qui. La data ci va dentro apposta, perché un
     indirizzo identico verrebbe ripreso dalla memoria del browser e la
     notifica mostrerebbe il disegno di prima. */
  var img="anelli.png?k="+Math.round(t.kcal)+"&ok="+S.ob.kcal+
          "&p="+Math.round(t.p)+"&op="+S.ob.p+"&c="+tintePerIlDisegno()+
          "&v="+Date.now();
  navigator.serviceWorker.ready.then(function(reg){
    return reg.showNotification(num(t.kcal)+" di "+S.ob.kcal+" kcal",{
      tag:CERCHIO_TAG, renotify:false, silent:true,
      badge:cerchioFile(q), icon:"icon-192.png", image:img,
      body:(rest>=0?"Ti restano "+num(rest)+" kcal":"Sei sopra di "+num(-rest)+" kcal")+
           " \u00b7 "+num(t.p)+" g di proteine su "+S.ob.p
    });
  }).catch(function(){});
}
function spegniCerchio(){
  if(!navigator.serviceWorker) return;
  navigator.serviceWorker.ready.then(function(reg){
    return reg.getNotifications({tag:CERCHIO_TAG}).then(function(l){
      l.forEach(function(n){ n.close(); });
    });
  }).catch(function(){});
}
/* Il permesso si può chiedere solo dopo un tocco suo: da qui, non all'avvio. */
function accendiCerchio(){
  if(!cerchioSiPuo()){ S.msg="Questo browser non sa mostrare il cerchio."; render(); return; }
  Notification.requestPermission().then(function(r){
    if(r==="granted"){ S.cerchio=true; salvaCfg(); aggiornaCerchio(); }
    else { S.cerchio=false; salvaCfg();
           S.msg="Senza il permesso delle notifiche il cerchio non pu\u00f2 comparire."; }
    render();
  });
}

/* ---------- quello che dice la Palestra ----------
   L'app della palestra salva le sue sedute sullo stesso telefono e sullo
   stesso magazzino: qui basta leggerle. Nessun collegamento, nessuna rete,
   niente da sincronizzare — e se la Palestra non è mai stata aperta su questo
   telefono, l'indice non c'è e non succede niente.
   **Il Diario non scrive mai dentro le chiavi palestra.**
   Si rilegge solo quando cambia davvero, per non ridisegnare per niente. */
var palGrezzo=null;
function leggiPalestra(){
  var t=null;
  try{ t=localStorage.getItem(K_PAL); }catch(e){ t=null; }
  if(t===palGrezzo) return false;
  palGrezzo=t;
  try{ S.pal=t?(JSON.parse(t)||{}):{}; }catch(e){ S.pal={}; }
  return true;
}
function palestraDi(data){
  var v=S.pal[data];
  if(!v) return null;
  if(!(v.serie>0)&&!(v.minC>0)) return null;
  return v;
}
/* Le calorie della seduta, stimate come per la camminata e con lo stesso
   patto: **si mostrano e basta**, non entrano nel deficit e non cambiano i
   grammi di grasso. Conto classico kcal/min = MET x 3,5 x kg / 200.
   Ai pesi va MET 3,5 — quello dei circuiti con recupero, non quello dello
   sforzo puro: fra una serie e l'altra c'è un minuto fermo, e contarlo come
   lavoro raddoppierebbe il numero. Ogni serie vale un minuto e mezzo: mezzo
   di lavoro e uno di recupero, che è il timer della Palestra.
   Al cardio va MET 5, camminata in pendenza e cyclette a ritmo tranquillo.
   I minuti di cardio arrivano già contati dalla Palestra, che è l'unica a
   sapere quanto dura ogni blocco. */
var MET_PESI=3.5, MET_CARDIO=5, MIN_PER_SERIE=1.5;
function kcalPalestra(v){
  var pe=Number(S.ob.peso)||0;
  if(!v||!pe) return 0;
  var q=function(met,min){ return met*3.5*pe/200*min; };
  return q(MET_PESI,(Number(v.serie)||0)*MIN_PER_SERIE)+q(MET_CARDIO,Number(v.minC)||0);
}
/* ---------- quello che hai bruciato: camminata e palestra ----------
   Stanno affiancate come Carboidrati e Grassi, chiesto il 2026-08-28: due
   riquadri interi uno sotto l'altro occupavano mezza schermata per due numeri.

   **I due cerchi hanno la stessa scala**, se no confrontarli a occhio non
   vorrebbe dire niente: 600 kcal riempiono il cerchio, che è più o meno una
   seduta di palestra intera o una camminata molto lunga.
   La superficie cresce col numero, non il raggio: l'occhio di un cerchio legge
   l'area, e col raggio una giornata da 100 kcal sarebbe un puntino invisibile
   invece di un sesto di quella piena. */
var RIF_BRUCIATE=600;
function discoBruciate(kcal){
  var D=46, c=D/2, Rmax=c-1;
  var r=Rmax*Math.sqrt(Math.min(1,Math.max(0,kcal)/RIF_BRUCIATE));
  var v='<svg class="br-svg" viewBox="0 0 '+D+' '+D+'" aria-hidden="true">';
  v+='<circle cx="'+c+'" cy="'+c+'" r="'+Rmax+'" style="fill:var(--traccia);stroke:var(--linea)" stroke-width="1"/>';
  if(r>0.8) v+='<circle cx="'+c+'" cy="'+c+'" r="'+r.toFixed(1)+'" style="fill:var(--verde)"/>';
  return v+'</svg>';
}
/* **Le calorie sono il numero grande, il resto sta sotto** (chiesto il
   2026-08-29). Prima erano al contrario: 8200 in grande e le calorie in
   piccolo. Ma i passi e le serie sono il come, le calorie sono il quanto — ed
   è l'unica delle due misure che si confronta fra camminata e palestra, che è
   poi il motivo per cui le due carte stanno affiancate. */
function cartaBruciate(et,kcal,sotto,coda){
  return '<div class="pannello mini brucia"><div class="etichetta">'+et+'</div>'+
    '<div class="br-riga">'+discoBruciate(kcal)+
      '<div class="br-txt">'+
      '<div class="br-n'+(kcal>0?'':' spenta')+'">'+(kcal>0?'<span class="unita">\u2248 </span>':'')+
        num(kcal)+'<span class="unita"> kcal</span></div>'+
      '<div class="br-sotto">'+sotto+'</div>'+
      '</div></div>'+(coda||'')+'</div>';
}

/* Una riga sola che racconta la seduta, usata in più posti. */
function rigaPalestra(v,senzaSerie){
  var p=[];
  if(!senzaSerie&&v.serie>0) p.push(v.serie+(v.tot?" serie su "+v.tot:" serie"));
  if(v.minC>0) p.push(v.minC+"\u2032 di cardio");
  if(v.volume>0) p.push(num(v.volume)+" kg sollevati");
  return p.join(" \u00b7 ");
}

function salvaCfg(){ scrivi(K_CFG,{ob:S.ob,miei:S.miei,recenti:S.recenti,tema:S.tema,fabV:FAB_V,drive:S.drive,cerchio:S.cerchio}); }

function totali(v){
  return (v||S.voci).reduce(function(t,x){
    return {kcal:t.kcal+x.kcal,p:t.p+x.p,c:t.c+x.c,g:t.g+x.g};
  },{kcal:0,p:0,c:0,g:0});
}

var tSalva=null;
function salvaOra(){
  clearTimeout(tSalva); tSalva=null;
  var t=totali(S.voci);
  var ok=scrivi(K_G+S.data,{voci:S.voci,totali:t,passi:S.passi});
  /* Un giorno con i soli passi è comunque un giorno registrato: se lo
     cancellassimo dall'indice, la camminata sparirebbe dallo storico. */
  if(S.voci.length===0&&!S.passi) delete S.indice[S.data];
  else S.indice[S.data]={kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),g:Math.round(t.g),n:S.voci.length,passi:S.passi};
  ok=scrivi(K_IDX,S.indice)&&ok;
  return ok;
}
function salva(){
  S.spia="in corso"; aggiornaSpia();
  clearTimeout(tSalva);
  tSalva=setTimeout(function(){
    var ok=salvaOra();
    aggiornaCerchio();
    S.spia=ok?"fatto":"errore"; aggiornaSpia();
    setTimeout(function(){S.spia="";aggiornaSpia();},1600);
    driveFraPoco();
  },500);
}
/* Il salvataggio aspetta mezzo secondo per non riscrivere a ogni tocco.
   Se l'app viene chiusa o mandata in secondo piano prima che scada,
   quella voce andrebbe persa: il telefono può congelare la pagina senza
   preavviso. Qui la scriviamo subito. */
function salvaSeInSospeso(){ if(tSalva) salvaOra(); }
window.addEventListener("pagehide",salvaSeInSospeso);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden") salvaSeInSospeso();
});
function aggiornaSpia(){
  var e=document.querySelector(".spia"); if(!e)return;
  e.className="spia"+(S.spia==="errore"?" errore":"");
  e.textContent=S.spia==="in corso"?"salvo…":S.spia==="fatto"?"salvato":S.spia==="errore"?"non salvato":"";
}

/* il giorno cambia da solo */
function controllaData(){
  var d=oggiISO();
  if(d!==S.data){
    var t=totali(S.voci);
    scrivi(K_G+S.data,{voci:S.voci,totali:t,passi:S.passi});
    S.data=d;
    var g=leggi(K_G+d,{voci:[]});
    S.voci=g.voci||[];
    S.passi=Number(g.passi)||0;
    S.msg="È un nuovo giorno. Ieri è archiviato nello storico.";
    S.vista="oggi";
    render();
    aggiornaCerchio();
  }
}
setInterval(controllaData,20000);
/* la sfumatura del grasso è calcolata, non basta cambiare le variabili CSS:
   quando l'ora fa scattare il tema bisogna ridisegnare */
setInterval(function(){ if(applicaTema()) render(); },20000);
/* Tornando dall'app della palestra la seduta di oggi è appena stata salvata:
   se l'indice è cambiato bisogna ridisegnare, altrimenti il pannello resterebbe
   a dire che non ti sei allenato. */
document.addEventListener("visibilitychange",function(){

/* ---------- azioni ---------- */
function aggiungiVoce(a,gr,pasto){
  var f=gr/100;
  S.voci.push({
    id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
    nome:a.nome, grammi:gr,
    kcal:a.kcal*f, p:a.p*f, c:a.c*f, g:a.g*f,
    pasto:pasto, ora:oraOra()
  });
  S.recenti=[{nome:a.nome,kcal:a.kcal,p:a.p,c:a.c,g:a.g,porz:gr}]
    .concat(S.recenti.filter(function(r){return r.nome!==a.nome;})).slice(0,14);
  salvaCfg(); salva();
  S.scelto=null; S.cerca=""; S.vista="oggi"; render();
}

function alimentiTrovati(){
  var q=S.cerca.trim().toLowerCase(); if(!q) return [];
  var tutti=S.miei.map(function(m){var o=Object.assign({},m);o.mio=true;return o;}).concat(ARCHIVIO);
  return tutti.filter(function(a){return a.nome.toLowerCase().indexOf(q)>=0;}).slice(0,40);
}

function trovaPerId(id){
  var t=S.miei.concat(ARCHIVIO);
  for(var i=0;i<t.length;i++) if(t[i].id===id) return t[i];
  return null;
}

function ricTotali(){
  var t={kcal:0,p:0,c:0,g:0,gr:0};
  S.ric.forEach(function(r){
    var f=(Number(r.gr)||0)/100;
    t.kcal+=r.kcal*f; t.p+=r.p*f; t.c+=r.c*f; t.g+=r.g*f; t.gr+=Number(r.gr)||0;
  });
  return t;
}

/* ---------- i passi che arrivano dall'app contapassi ----------
   L'app "Diario passi" legge i passi da Health Connect — cosa che una pagina
   web non può fare, né oggi né mai — e apre qui un indirizzo con dentro gli
   ultimi giorni. Stessa strada dell'orologio della Palestra: l'app racconta,
   il Diario decide. Nessuna app installata sul telefono serve al Diario.

     #passi=1;2026-08-27:8500,2026-08-26:11000

   Scrive **solo** il numero dei passi di quei giorni: le voci di cibo non le
   tocca nessuno, e i giorni che non conosce li lascia stare. */
var PASSI_V=1;
function leggiMessaggioPassi(){
  var h=String(location.hash||"");
  var i=h.indexOf("passi=");
  if(i<0) return null;
  var pezzi=h.slice(i+6).split(";");
  if(Number(pezzi[0])!==PASSI_V) return {errore:"versione"};
  var giorni=[], oggi=oggiISO(), fuori=false;
  (pezzi[1]||"").split(",").forEach(function(k){
    if(!k) return;
    var a=k.split(":"), d=a[0], n=Math.round(Number(a[1]));
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!isFinite(n)||n<0||n>200000){ fuori=true; return; }
    if(d>oggi) return;                    // un domani non esiste: si ignora
    giorni.push({data:d, passi:n});
  });
  if(fuori||!giorni.length) return {errore:"formato"};
  giorni.sort(function(a,b){ return a.data<b.data?1:-1; });
  return {giorni:giorni};
}
function pulisciPassi(){
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }
}
function passiRegistra(){
  var m=S.daContapassi; if(!m||m.errore) return;
  var n=0;
  m.giorni.forEach(function(g){
    var f=leggi(K_G+g.data,null)||{voci:[]};
    f.passi=g.passi;
    scrivi(K_G+g.data,f);
    var t=totali(f.voci||[]);
    var v=S.indice[g.data]||{kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),g:Math.round(t.g),n:(f.voci||[]).length};
    v.passi=g.passi;
    S.indice[g.data]=v;
    if(g.data===S.data) S.passi=g.passi;
    n++;
  });
  scrivi(K_IDX,S.indice);
  S.daContapassi=null; pulisciPassi();
  S.msg="Passi aggiornati: "+n+(n===1?" giorno.":" giorni.");
  S.vista="oggi"; render();
}
function passiAnnulla(){ S.daContapassi=null; pulisciPassi(); render(); }
function avvisoPassi(){
  var m=S.daContapassi; if(!m) return "";
  if(m.errore) return '<section class="pannello"><div class="etichetta">Passi dal contapassi</div>'+
    '<div class="errore">'+(m.errore==="versione"
      ? "L'app dei passi è di una versione diversa da questa. Aggiornala."
      : "Il messaggio non si legge. Scrivi i passi a mano.")+'</div>'+
    '<button class="b2" data-az="passi-no">Chiudi</button></section>';
  var el=m.giorni.slice(0,7).map(function(g){
    var vecchi=(S.indice[g.data]&&S.indice[g.data].passi)||0;
    return '<div class="dett-r"><span>'+dataEstesa(g.data)+'</span><strong>'+num(g.passi)+
           (vecchi&&vecchi!==g.passi?' <span class="unita">(era '+num(vecchi)+')</span>':'')+'</strong></div>';
  }).join("");
  return '<section class="pannello"><div class="etichetta">Passi dal contapassi</div>'+
    '<div class="cifra-m">'+m.giorni.length+'<span class="unita"> '+(m.giorni.length===1?"giorno":"giorni")+'</span></div>'+
    el+
    '<div class="nota">Aggiorna solo i passi: quello che hai mangiato non viene toccato.</div>'+
    '<button class="b1" data-az="passi-si">Registra</button>'+
    '<button class="b2" data-az="passi-no">Annulla</button></section>';
}

/* ---------- render ---------- */
function render(){
  applicaTema();
  var h="";
  /* Il titolone dice dove sei. Nella schermata di oggi è il giorno — e con un
     giorno aperto dalla striscia diventa quel giorno, perché tutta la
     schermata parla di lui. Nelle altre schermate è il nome della schermata:
     scritto "Oggi" sopra lo Storico sembrava un errore. */
  var mostrato=(S.vista==="oggi"&&S.aperto)?S.aperto:S.data;
  var oggi=mostrato===oggiISO();
  var titolo, lato;
  if(S.vista==="oggi"){
    if(oggi){ titolo="Oggi"; lato=maiuscola(dataEstesa(mostrato)); }
    /* Di un giorno passato il titolone porta il nome del giorno e la data gli
       sta di fianco: così anche "Mercoledì 19 settembre" resta su una riga. */
    else { var pezzi=dataEstesa(mostrato).split(" "); titolo=maiuscola(pezzi[0]); lato=pezzi.slice(1).join(" "); }
  }
  else if(S.vista==="aggiungi"){ titolo="Aggiungi"; lato=maiuscola(dataEstesa(S.data)); }
  else if(S.vista==="storico"){
    var ng=Object.keys(S.indice).length;
    titolo="Storico"; lato=ng?(ng+(ng===1?" giorno registrato":" giorni registrati")):"";
  }
  else { titolo="Impostazioni"; lato=""; }
  h+='<header class="testata"><div class="testata-riga"><div>'+
     '<div class="occhiello">Diario</div>'+
     '<h1 class="data-titolo">'+titolo+
     (lato?'<span class="titolo-lato">'+lato+'</span>':"")+'</h1></div>'+
     '<div class="spia"></div></div></header>';

  if(S.msg) h+='<div class="avviso" data-az="chiudi-msg">'+esc(S.msg)+' <span class="avviso-x">chiudi</span></div>';

  h+='<main class="corpo">';
  if(S.daContapassi) h+=avvisoPassi();
  if(S.vista==="oggi") h+=vistaOggi();
  else if(S.vista==="aggiungi") h+=vistaAggiungi();
  else if(S.vista==="storico") h+=vistaStorico();
  else h+=vistaImpostazioni();
  h+='</main>';

  h+='<nav class="barra">';
  [["oggi","Oggi"],["aggiungi","Aggiungi"],["storico","Storico"],["impostazioni","Impostazioni"]]
    .forEach(function(v){
      h+='<button class="b-voce'+(S.vista===v[0]?" on":"")+'" data-az="vista" data-v="'+v[0]+'">'+v[1]+'</button>';
    });
  h+='</nav>';

  document.getElementById("app").innerHTML=h;
  aggiornaSpia();
  if(S.focus){
    var e=document.querySelector('[data-in="'+S.focus+'"]');
    if(e){ e.focus(); try{var n=e.value.length;e.setSelectionRange(n,n);}catch(x){} }
  }
}

/* I due anelli. Fuori le calorie, dentro le proteine.
   **Tutti e due sull'obiettivo della giornata** (1500 kcal e 160 g), non sul
   fabbisogno: chiesto il 2026-08-28. Prima l'anello delle calorie era tarato
   sul fabbisogno, con una tacca all'obiettivo, e l'arco vuoto era il deficit.
   Era vero ma non rispondeva alla domanda che si fa lui guardandolo — "quanto
   mi manca a quello che devo fare oggi" — e le due misure erano due, con due
   scale diverse. Il deficit non è sparito: sta nella cifra sotto e nel disco
   del grasso, che continuano a leggersi sul fabbisogno.

   **Oltre l'obiettivo l'anello riparte per un secondo giro, in rosso.** Il
   primo giro resta pieno sotto, così si vede a colpo d'occhio che il giro è
   già stato fatto: cerchio blu pieno più un arco rosso che cresce sopra.
   Fermarlo al pieno, come faceva prima, nascondeva proprio i giorni che
   contano di più. Oltre i due giri resta pieno: a quel punto il numero lo dice
   meglio di qualsiasi disegno.

   Le proteine no: superare i grammi di proteine non è una cosa da segnalare,
   e il rosso lì vorrebbe dire una colpa che non c'è. */
function anelli(kcal,prot,dim,spesso){
  var R=(dim/2)-spesso/2-1, r=R-spesso-2, cx=dim/2, cy=dim/2;
  var CR=2*Math.PI*R, cr=2*Math.PI*r;
  var qk=kcal/Math.max(1,S.ob.kcal), qp=Math.min(1,prot/Math.max(1,S.ob.p));
  var primo=Math.min(1,qk), secondo=Math.min(1,Math.max(0,qk-1));
  function ar(raggio,giro,colore,quota){
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+raggio+'" fill="none" style="stroke:var('+colore+
           ')" stroke-width="'+spesso+'" stroke-linecap="round" stroke-dasharray="'+giro+
           '" stroke-dashoffset="'+(giro*(1-quota))+'" class="arco"/>';
  }
  var s='<svg class="anelli" viewBox="0 0 '+dim+' '+dim+'" width="'+dim+'" height="'+dim+'">';
  s+='<g transform="rotate(-90 '+cx+' '+cy+')">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" style="stroke:var(--traccia)" stroke-width="'+spesso+'"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" style="stroke:var(--traccia)" stroke-width="'+spesso+'"/>';
  if(primo>0) s+=ar(R,CR,"--blu",primo);
  if(secondo>0) s+=ar(R,CR,"--rosso",secondo);
  if(qp>0) s+=ar(r,cr,"--senape",qp);
  s+='</g></svg>';
  return s;
}
/* Le calorie della camminata, da passi e peso.
   1400 passi ≈ un chilometro (passo di 72 cm), e si contano **0,5 kcal per
   chilo per chilometro**: è la spesa *in più* rispetto allo stare fermi, non
   quella lorda. Il lordo (0,9) sarebbe più bello da vedere ma conterebbe due
   volte quello che il fabbisogno già include.
   Deciso il 2026-08-27: questa stima **si mostra e basta**. Non entra nel
   deficit, non entra nei grammi di grasso. Se un giorno lui vuole il
   contrario, va detto a lui che il numero è una stima con ±30% di errore. */
function kcalPassi(passi){
  var pe=Number(S.ob.peso)||0;
  if(!passi||!pe) return 0;
  return passi/1400*pe*0.5;
}
var KCAL_PER_KG=7700;
/* Il segno conta: positivo è il grasso risparmiato stando sotto il fabbisogno,
   negativo è quello messo su superandolo. Prima il conto si fermava a zero e
   una giornata sopra il fabbisogno sembrava una giornata neutra. */
function grammiGrasso(kcal){ return (S.ob.fab-kcal)/KCAL_PER_KG*1000; }
function grammiPersi(kcal){ return Math.max(0,grammiGrasso(kcal)); }
function grammiSopra(kcal){ return Math.max(0,-grammiGrasso(kcal)); }
function grammiMax(){ return S.ob.fab/KCAL_PER_KG*1000; }
/* I grammi come si leggono nello storico: col segno, e col colore che dice da
   che parte stanno. Positivo è grasso risparmiato, sotto zero è ripreso. */
function grammiScritti(gr){
  var v=Math.round(gr);
  return '<em class="'+(v<0?"gu":"gi")+'">'+(v<0?"\u2212":"+")+num(Math.abs(v))+'</em>';
}
function grammiTarget(){ return Math.max(1,(S.ob.fab-S.ob.kcal)/KCAL_PER_KG*1000); }
function lerp(a,b,t){ return Math.round(a+(b-a)*t); }
function coloreGrassi(gr){
  var scuro=temaScuro();
  var A=scuro?[217,164,65]:[192,132,17];
  var V=scuro?[78,154,114]:[46,107,79];
  var R=scuro?[201,105,75]:[163,52,31];
  var r=gr/grammiTarget(), c;
  if(r<=1){ c=[lerp(A[0],V[0],r),lerp(A[1],V[1],r),lerp(A[2],V[2],r)]; }
  else { var u=Math.min(1,r-1); c=[lerp(V[0],R[0],u),lerp(V[1],R[1],u),lerp(V[2],R[2],u)]; }
  return "rgb("+c[0]+","+c[1]+","+c[2]+")";
}
/* Il grasso stimato è un cerchio che si sgonfia: al massimo quando non hai
   mangiato niente e hai risparmiato tutto il fabbisogno, sempre più piccolo
   man mano che mangi. Il tratteggio segna l'obiettivo, così si vede a colpo
   d'occhio se il pieno lo supera o no. */
function cerchioGrassi(kcal){
  var gr=grammiPersi(kcal), su=grammiSopra(kcal), gmax=grammiMax(), gtar=grammiTarget();
  var D=118, c=D/2, Rmax=c-1;
  var r=Rmax*Math.min(1,gr/gmax), rt=Rmax*Math.min(1,gtar/gmax);
  var v='<div class="grasso"><svg class="grasso-svg" viewBox="0 0 '+D+' '+D+'" aria-hidden="true">';
  v+='<circle cx="'+c+'" cy="'+c+'" r="'+Rmax+'" style="fill:var(--traccia);stroke:var(--linea)" stroke-width="1"/>';
  if(su>0){
    /* Il cerchio si è sgonfiato fino a sparire arrivando al fabbisogno: da lì
       in poi ne cresce uno rosso, che è grasso guadagnato, non risparmiato.
       La scala è quella dell'obiettivo: pieno quando hai messo su tanto
       quanto in una buona giornata ne avresti tolto. */
    var rs=Rmax*Math.min(1,su/gtar);
    if(rs>0.6) v+='<circle cx="'+c+'" cy="'+c+'" r="'+rs.toFixed(1)+'" style="fill:var(--rosso)" class="grasso-c"/>';
  } else if(r>0.6) v+='<circle cx="'+c+'" cy="'+c+'" r="'+r.toFixed(1)+'" fill="'+coloreGrassi(gr)+'" class="grasso-c"/>';
  if(su===0) v+='<circle cx="'+c+'" cy="'+c+'" r="'+rt.toFixed(1)+'" fill="none" style="stroke:var(--inchiostro)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>';
  v+='</svg><div class="grasso-n'+(su>0?" rossa":"")+'">'+(su>0?"+"+num(su):num(gr))+'</div>'+
     '<div class="col-cap">'+(su>0?"grasso guadagnato":"grasso stimato")+'</div></div>';
  return v;
}


function isoSposta(iso,n){
  var a=iso.split("-").map(Number), d=new Date(a[0],a[1]-1,a[2]+n);
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
/* Indietro si può andare fino al primo giorno registrato — prima non c'è
   niente da vedere — ma i sette giorni della striscia si aprono sempre, anche
   su un diario appena cominciato. */
function primoGiorno(){
  var k=Object.keys(S.indice).sort(), sette=isoSposta(oggiISO(),-6);
  return (k.length&&k[0]<sette)?k[0]:sette;
}
/* La striscia è una finestra di sette giorni. Di solito finisce su oggi;
   scorrendo il dito oltre il bordo sinistro arretra di un giorno per volta,
   così si arriva indietro quanto si vuole senza perdere di vista dove si è.
   S.finestra è l'ultimo giorno mostrato, e vale null quando è oggi. */
function fineFinestra(){
  var oggi=oggiISO();
  return (S.finestra&&S.finestra<oggi)?S.finestra:oggi;
}
function ultimi7(){
  var out=[], oggi=oggiISO(), fine=fineFinestra();
  for(var k=6;k>=0;k--){
    var iso=isoSposta(fine,-k);
    var a=iso.split("-").map(Number), d=new Date(a[0],a[1]-1,a[2]);
    var v=S.indice[iso];
    if(iso===oggi){ var t=totali(S.voci); v={kcal:t.kcal,p:t.p,n:S.voci.length}; }
    out.push({iso:iso, lettera:["D","L","M","M","G","V","S"][d.getDay()],
              kcal:v?v.kcal:0, p:v?v.p:0, vuoto:!v||!v.n});
  }
  return out;
}

/* Dettaglio di una giornata: totali e voci raggruppate per pasto.
   Usato sia nella scheda che si apre dalla striscia dei 7 giorni,
   sia nello storico, così i due posti mostrano le stesse cose. */
function dettaglioGiorno(voci,conRiepilogo,passi,data){
  voci=voci||[];
  passi=Number(passi)||0;
  var pal=data?palestraDi(data):null;
  if(voci.length===0){
    var fatto=[];
    if(passi) fatto.push(num(passi)+' passi');
    if(pal) fatto.push('palestra ('+rigaPalestra(pal)+')');
    return '<div class="sc-vuoto">'+
      (fatto.length?fatto.join(', ')+', ma nessuna voce registrata in questo giorno.'
                   :'Nessuna voce registrata in questo giorno.')+'</div>';
  }
  var t=totali(voci), scarto=S.ob.kcal-t.kcal, h="";

  if(conRiepilogo){
    h+='<div class="due-cifre sc-tot">'+
       '<div><div class="etichetta">Calorie</div>'+
       '<div class="cifra-m'+(scarto<0?" rossa":"")+'">'+num(t.kcal)+'<span class="unita"> kcal</span></div></div>'+
       '<div><div class="etichetta">Proteine</div>'+
       '<div class="cifra-m">'+num(t.p)+'<span class="unita"> / '+S.ob.p+' g</span></div></div>'+
       '</div>';
    h+='<div class="sc-macro">Carboidrati '+num(t.c)+' g \u00b7 Grassi '+num(t.g)+' g \u00b7 '+
       voci.length+(voci.length===1?" voce":" voci")+
       (passi?' \u00b7 '+num(passi)+' passi (\u2248 '+num(kcalPassi(passi))+' kcal)':'')+
       (pal?' \u00b7 palestra '+pal.serie+' serie (\u2248 '+num(kcalPalestra(pal))+' kcal)':'')+'</div>';
    h+='<div class="p-piede">'+(scarto>=0
       ?"Sotto l\u2019obiettivo di "+num(scarto)+" kcal"
       :"Sopra l\u2019obiettivo di "+num(-scarto)+" kcal")+'</div>';
  }

  /* I pasti escono in ordine di orario, non nell'ordine fisso Colazione-
     Pranzo-Cena-Spuntino: una giornata passata si rilegge come è andata.
     Le voci senza ora (diari vecchi) finiscono in fondo, nell'ordine solito. */
  var ordine=PASTI.concat(["Altro"]), gruppi=[];
  ordine.forEach(function(pasto,i){
    var l=voci.filter(function(v){
      return pasto==="Altro" ? PASTI.indexOf(v.pasto)<0 : v.pasto===pasto;
    });
    if(l.length===0) return;
    var ore=l.map(function(v){return v.ora||"";}).filter(function(o){return o;}).sort();
    gruppi.push({pasto:pasto, voci:l, ora:ore.length?ore[0]:null, i:i});
  });
  gruppi.sort(function(a,b){
    if(a.ora&&b.ora) return a.ora<b.ora?-1:a.ora>b.ora?1:a.i-b.i;
    if(a.ora) return -1;
    if(b.ora) return 1;
    return a.i-b.i;
  });
  gruppi.forEach(function(gr){
    var pasto=gr.pasto;
    var l=gr.voci.slice().sort(function(x,y){return (x.ora||"")<(y.ora||"")?-1:(x.ora||"")>(y.ora||"")?1:0;});
    var tk=l.reduce(function(a,v){return a+v.kcal;},0);
    h+='<div class="sc-gruppo"><div class="g-testa"><h3 class="g-titolo">'+pasto+'</h3>'+
       '<span class="g-kcal">'+num(tk)+' kcal</span></div>';
    l.forEach(function(v){
      h+='<div class="voce"><div class="v-corpo"><div class="v-nome">'+esc(v.nome)+'</div>'+
         '<div class="v-dati">'+(v.ora?esc(v.ora)+' \u00b7 ':"")+num(v.grammi)+' g \u00b7 '+num(v.kcal)+
         ' kcal \u00b7 P '+num(v.p,1)+' \u00b7 C '+num(v.c,1)+' \u00b7 G '+num(v.g,1)+'</div></div></div>';
    });
    h+='</div>';
  });
  return h;
}

function vistaOggi(){
  var s7=ultimi7();
  /* Se un giorno della striscia è aperto, tutta la parte alta parla di quel
     giorno: anelli, cifre, grasso e macro. Prima i numeri grandi restavano
     sempre di oggi mentre sotto si leggeva un altro giorno. */
  /* **Oggi non si apre**: la parte alta parla già di oggi, e la scheda "Cosa
     hai mangiato" ripeterebbe l'elenco che sta qui sotto. Quando lo faceva,
     toccare il cerchio di oggi infilava un pannello da quasi 400 px in mezzo
     alla pagina e spingeva Camminata e Palestra fuori dallo schermo: due
     tocchi, e le due carte c'erano o non c'erano. Toccando oggi si torna a
     oggi, e basta. */
  var aperto=(S.aperto&&S.aperto!==S.data&&s7.some(function(g){return g.iso===S.aperto;}))?S.aperto:null;
  var passato=!!aperto;
  var voci=passato?S.apertoVoci:S.voci;
  var t=totali(voci), h="";
  /* dichiarati qui perché servono anche alla scheda del giorno aperto, che sta
     più in alto: prima quella riga leggeva `pa` prima che avesse un valore e
     mostrava sempre zero passi */
  var pa=passato?S.apertoPassi:S.passi;
  var gg=aperto||S.data, pal=palestraDi(gg);
  var rest=S.ob.kcal-t.kcal, oltreOb=t.kcal>S.ob.kcal;
  var deficit=S.ob.fab-t.kcal;

  h+='<section class="pannello quadrante">';
  /* Questa riga c'è sempre, anche su oggi dove non ha un pulsante da mostrare:
     se comparisse solo sui giorni passati, i cerchi scenderebbero di quaranta
     pixel a ogni scorrimento del dito. La data è già il titolo della pagina,
     qui basta dire dove sei. */
  h+='<div class="p-testa quad-testa"><span class="etichetta">'+(passato?"Giorno passato":"Oggi")+'</span>'+
     (passato?'<button class="sc-chiudi" data-az="apri" data-d="'+aperto+'">torna a oggi</button>':"")+
     '</div>';
  h+='<div class="quad-riga">'+
     '<div class="anelli-box">'+anelli(t.kcal,t.p,176,13)+
     '<div class="centro">'+
       '<div class="c-kcal">'+num(t.kcal)+'</div>'+
       '<div class="c-sotto">di '+S.ob.kcal+' kcal</div>'+
       '<div class="c-prot">'+num(t.p)+' <span>/'+S.ob.p+' g</span></div>'+
     '</div></div>'+
     cerchioGrassi(t.kcal)+
     '</div>'+
     '<div class="legenda">'+
       '<span class="lg"><i class="pt blu"></i>Calorie</span>'+
       '<span class="lg"><i class="pt sen"></i>Proteine</span>'+
       (t.kcal>S.ob.kcal?'<span class="lg"><i class="pt ros"></i>Oltre le '+S.ob.kcal+'</span>':'')+
     '</div>'+
     '<div class="due-cifre">'+
       '<div><div class="etichetta">'+(oltreOb?"Oltre l\'obiettivo":(passato?"Sotto l\'obiettivo":"Ancora fino a "+S.ob.kcal))+'</div>'+
       '<div class="cifra-m'+(oltreOb?" rossa":"")+'">'+(oltreOb?"+"+num(-rest):num(rest))+'<span class="unita"> kcal</span></div></div>'+
       '<div><div class="etichetta">'+(passato?"Deficit del giorno":"Deficit di oggi")+'</div>'+
       '<div class="cifra-m'+(deficit<0?" rossa":"")+'">'+num(deficit)+'<span class="unita"> kcal</span></div></div>'+
     '</div>'+
     '</section>';

  // settimana
  var centrati=0, tot7=0, np=0, totP=0;
  s7.forEach(function(g){ if(!g.vuoto){ tot7+=g.kcal; totP+=g.p; np++; if(g.kcal<=S.ob.kcal) centrati++; } });
  var fine7=fineFinestra(), arretrata=fine7!==oggiISO();
  h+='<section class="pannello"><div class="p-testa"><span class="etichetta">'+
     (arretrata?"Dal "+dataBreve(s7[0].iso)+" al "+dataBreve(fine7):"Ultimi 7 giorni")+'</span>'+
     '<span class="g-kcal">'+centrati+' su '+np+' sotto '+S.ob.kcal+'</span></div><div class="settimana">';
  /* Ogni cerchio della striscia si apre, senza eccezioni: oggi compreso e
     anche i giorni senza voci. Le eccezioni sembrano guasti: chi tocca un
     cerchio che non risponde pensa che l'app sia rotta, non che sia vuota. */
  s7.forEach(function(g){
    h+='<button class="sg'+(g.iso===oggiISO()?" oggi":"")+(aperto===g.iso?" on":"")+'"'+
       ' data-az="apri" data-d="'+g.iso+'">'+
       '<div class="sg-anello'+(g.vuoto?" spento":"")+'">'+anelli(g.kcal,g.p,42,4)+'</div>'+
       '<div class="sg-l">'+g.lettera+'</div></button>';
  });
  h+='</div><div class="p-piede">'+
     (np===0?"Nessun giorno registrato ancora."
      :"Media "+num(tot7/np)+" kcal e "+num(totP/np)+" g di proteine al giorno.")+
     '</div></section>';

  h+='<section class="coppia">'+mini("Carboidrati",t.c,S.ob.c)+mini("Grassi",t.g,S.ob.g)+'</section>';

  /* Camminata e palestra stanno affiancate e **non toccano i numeri di sopra**:
     sono cose che hai fatto, non un permesso di mangiare di più. Deciso con lui. */
  /* Sul giorno di oggi il numero dei passi **è** la casella dove si scrivono:
     ripeterlo sarebbe lo stesso numero due volte in un riquadro largo mezzo
     schermo. La sottolineatura dice che si tocca. */
  var camm=passato
    ? (pa>0?num(pa)+" passi":"nessun passo segnato")
    : '<input class="br-in" data-in="passi" type="number" inputmode="numeric" value="'+
      (S.passi||"")+'" placeholder="0"><span class="br-u"> passi</span>';
  h+='<section class="coppia">'+
     cartaBruciate("Camminata",kcalPassi(pa),camm)+
     cartaBruciate("Palestra",pal?kcalPalestra(pal):0,
       pal?pal.serie+(pal.tot?" serie su "+pal.tot:" serie"):"nessun allenamento",
       pal?'<div class="br-coda">'+rigaPalestra(pal,true)+'</div>':'')+
     '</section>'+
     '<div class="nota nota-coppia"><strong>I passi si scrivono toccando il numero</strong>, oppure te li manda l\u2019app dei passi; la palestra arriva da sola dall\u2019app Palestra. Le calorie sono stime: non entrano nel deficit e non cambiano i grammi di grasso.</div>';

  /* La scheda del giorno passato sta **qui sotto**, nello stesso posto dove su
     oggi c'è l'elenco di quello che hai mangiato: è la stessa roba, e messa
     qui non sposta niente di quello che sta sopra. Quando stava subito sotto
     la striscia, cambiare giorno spingeva Camminata e Palestra fuori dallo
     schermo e sembravano sparite. */
  if(aperto){
    // per un giorno passato l'intestazione sta già sul quadrante qui sopra
    h+='<section class="pannello"><div class="p-testa">'+
       '<span class="etichetta">Cosa hai mangiato</span>'+
       '</div>'+dettaglioGiorno(voci,false,pa,aperto)+'</section>';
  }


  // un giorno passato non si modifica: niente pulsante e niente elenco con "togli"
  if(passato) return h;

  h+='<button class="b1" data-az="vista" data-v="aggiungi">Aggiungi quello che hai mangiato</button>';

  var gruppi=PASTI.map(function(p){return {p:p,l:S.voci.filter(function(v){return v.pasto===p;})};})
                  .filter(function(x){return x.l.length>0;});
  if(gruppi.length===0){
    /* Diario completamente vuoto: quasi sempre è un dispositivo nuovo su cui
       si vuole rivedere il proprio diario. Il ripristino sta in fondo alle
       Impostazioni, dove nessuno lo cerca: lo offriamo qui, dove si guarda. */
    var maiUsato=Object.keys(S.indice).length===0;
    h+='<div class="vuoto">'+(maiUsato
        ?"Qui non c\u2019è ancora niente. Registra il primo alimento appena lo mangi: bastano dieci secondi."
        :"Nessuna voce per oggi. Registra il primo alimento appena lo mangi: bastano dieci secondi.");
    if(maiUsato){
      h+='<label class="b2">Ho un file di backup, caricalo'+
         '<input class="file-nascosto" type="file" accept=".json,application/json" data-in="file-backup"></label>';
    }
    h+='</div>';
  } else {
    gruppi.forEach(function(x){
      var tk=x.l.reduce(function(a,v){return a+v.kcal;},0);
      h+='<section class="gruppo"><div class="g-testa"><h2 class="g-titolo">'+x.p+'</h2>'+
         '<span class="g-kcal">'+num(tk)+' kcal</span></div>';
      x.l.forEach(function(v){
        h+='<div class="voce"><div class="v-corpo"><div class="v-nome">'+esc(v.nome)+'</div>'+
           '<div class="v-dati">'+num(v.grammi)+' g \u00b7 '+num(v.kcal)+' kcal \u00b7 P '+num(v.p,1)+
           ' \u00b7 C '+num(v.c,1)+' \u00b7 G '+num(v.g,1)+'</div></div>'+
           '<button class="v-togli" data-az="togli" data-id="'+v.id+'">togli</button></div>';
      });
      h+='</section>';
    });
  }
  return h;
}

function mini(et,val,ob){
  var q=Math.min(1,val/Math.max(1,ob));
  return '<div class="pannello mini"><div class="etichetta">'+et+'</div>'+
    '<div class="cifra-m">'+num(val)+'<span class="unita">/'+ob+' g</span></div>'+
    '<div class="nastro sottile"><i class="neutro" style="width:'+(q*100)+'%"></i></div></div>';
}

/* ---------- il mese nello storico ----------
   Lo storico si apriva sugli ultimi giorni e basta: per capire com'era andato
   un mese intero bisognava scorrere. Qui sopra c'è il mese, con il calendario
   dei giorni registrati e i totali, e in evidenza i grammi di grasso, che è
   il numero che gli interessa.
   Il conto dei grammi usa il fabbisogno di adesso, anche sui mesi vecchi: se
   cambi il fabbisogno in Impostazioni, tutto lo storico si rilegge con il
   numero nuovo. È voluto — serve a confrontare i mesi con lo stesso metro. */
function meseDiOggi(){ var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1); }
function meseSposta(m,n){
  var a=m.split("-").map(Number), d=new Date(a[0],a[1]-1+n,1);
  return d.getFullYear()+"-"+p2(d.getMonth()+1);
}
function meseEsteso(m){ var a=m.split("-").map(Number); return MM[a[1]-1]+" "+a[0]; }
function datiMese(m){
  var t={n:0,kcal:0,p:0,c:0,g:0,persi:0,presi:0,sotto:0,passi:0,nPassi:0};
  /* Gli allenamenti si contano a parte, sull'indice della Palestra: un giorno
     in cui è andato in palestra senza segnare niente da mangiare non sta
     nell'indice del Diario, ma resta un allenamento fatto. */
  t.pal=0; t.palKcal=0; t.palSerie=0;
  Object.keys(S.pal).forEach(function(d){
    if(d.slice(0,7)!==m) return;
    var v=palestraDi(d); if(!v) return;
    t.pal++; t.palSerie+=Number(v.serie)||0; t.palKcal+=kcalPalestra(v);
  });
  Object.keys(S.indice).forEach(function(d){
    if(d.slice(0,7)!==m) return;
    var v=S.indice[d];
    t.n++; t.kcal+=v.kcal; t.p+=v.p; t.c+=v.c; t.g+=v.g;
    if(v.passi){ t.passi+=v.passi; t.nPassi++; }
    t.persi+=grammiPersi(v.kcal); t.presi+=grammiSopra(v.kcal);
    if(v.kcal<=S.ob.kcal) t.sotto++;
  });
  return t;
}
function pannelloMese(){
  var oggiM=meseDiOggi();
  var chiavi=Object.keys(S.indice).sort();
  var primoM=chiavi.length?chiavi[0].slice(0,7):oggiM;
  /* **Si apre sull'ultimo mese che ha dei giorni, non sul mese di oggi.**
     Il 1º settembre 2026 Manlio ha aperto lo Storico e ha visto un calendario
     vuoto: "sono spariti tutti i dati". Non era sparito niente — il mese nuovo
     era semplicemente ancora senza giorni — ma il primo giorno di ogni mese
     l'app dava a chi la guarda la peggiore delle notizie possibili, e falsa.
     Se il mese corrente ha già dei giorni `ultimoM` è il mese corrente, quindi
     di norma non cambia niente. */
  var ultimoM=chiavi.length?chiavi[chiavi.length-1].slice(0,7):oggiM;
  var m=S.mese||ultimoM;
  if(m>oggiM) m=oggiM;
  if(m<primoM) m=primoM;
  S.mese=m;
  var t=datiMese(m), a=m.split("-").map(Number);
  var neiMese=new Date(a[0],a[1],0).getDate();
  var primoGiorno=(new Date(a[0],a[1]-1,1).getDay()+6)%7;  /* la settimana parte da lunedì */
  var oggi=oggiISO();

  var h='<section class="pannello"><div class="etichetta">Mese per mese</div>'+
    '<div class="mese-nav">'+
      '<button class="frec" data-az="mese" data-v="-1"'+(m<=primoM?" disabled":"")+' aria-label="mese precedente">‹</button>'+
      '<div class="mese-t">'+meseEsteso(m)+'</div>'+
      '<button class="frec" data-az="mese" data-v="1"'+(m>=oggiM?" disabled":"")+' aria-label="mese successivo">›</button>'+
    '</div>';

  /* Il calendario si costruisce per settimane, non per giorni di fila: in fondo
     a ogni riga ci va il totale della settimana, e per sommarlo bisogna sapere
     dove la riga finisce. Le caselle prima del primo e dopo l'ultimo si
     riempiono di vuoto, se no l'ottava colonna si sfalserebbe. */
  var settimane=[], riga=[];
  for(var i=0;i<primoGiorno;i++) riga.push(0);
  for(var g=1;g<=neiMese;g++){ riga.push(g); if(riga.length===7){ settimane.push(riga); riga=[]; } }
  if(riga.length){ while(riga.length<7) riga.push(0); settimane.push(riga); }

  h+='<div class="cal">';
  ["L","M","M","G","V","S","D"].forEach(function(l){ h+='<div class="cal-l">'+l+'</div>'; });
  h+='<div class="cal-l">SETT</div>';
  settimane.forEach(function(r){
    var somma=0, quanti=0;
    r.forEach(function(g){
      if(!g){ h+='<div class="cal-g vuota"></div>'; return; }
      var iso=m+"-"+p2(g), v=S.indice[iso], cl=(iso===oggi?" oggi":"");
      /* Ogni giorno con dati si tocca e si apre qui sotto. I giorni vuoti sono
         grigi e piatti: si vede che non c'è niente da aprire, non sembrano
         pulsanti rotti. */
      if(!v){ h+='<div class="cal-g spenta'+cl+'"><b>'+g+'</b></div>'; return; }
      var gr=grammiGrasso(v.kcal); somma+=gr; quanti++;
      h+='<button class="cal-g dato'+cl+(S.aperto===iso&&S.apertoDove==="cal"?" on":"")+
         '" data-az="apri" data-dove="cal" data-d="'+iso+'"><b>'+g+'</b>'+grammiScritti(gr)+'</button>';
    });
    h+='<div class="cal-w">'+(quanti?grammiScritti(somma):'')+'</div>';
  });
  h+='</div>';

  h+='<div class="p-piede">I grammi di grasso di ogni giorno: <span class="gi">in verde</span> quelli persi, '+
     '<span class="gu">in rosso</span> quelli ripresi. In fondo a ogni riga il totale della settimana, '+
     '\u2014 la prima e l\u2019ultima contano solo i giorni di questo mese. Tocca un giorno per aprirne la scheda.</div>';
  /* La scheda va qui, attaccata al calendario: in fondo al pannello resterebbe
     sotto lo schermo e il tocco sembrerebbe non aver fatto niente. */
  if(S.aperto&&S.apertoDove==="cal"&&S.aperto.slice(0,7)===m){
    h+='<div class="dett">'+dettaglioGiorno(S.apertoVoci,true,S.apertoPassi,S.aperto)+'</div>';
  }

  if(t.n===0){
    /* Un mese vuoto non vuol dire un diario vuoto: se ce ne sono altri, dillo
       e indica la freccia, se no sembra che sia sparito tutto. */
    var altrove=chiavi.length;
    h+='<div class="p-piede">'+(t.pal
      ?t.pal+(t.pal===1?' allenamento in palestra':' allenamenti in palestra')+', ma nessun giorno di cibo registrato in questo mese.'
      :'Nessun giorno registrato in questo mese.')+
      (altrove?' Gli altri mesi sono tutti qui: toccando la freccia \u2039 torni indietro. In tutto hai '+
               altrove+(altrove===1?' giorno registrato':' giorni registrati')+'.':'')+
      '</div></section>';
    return h;
  }

  var netto=t.persi-t.presi;
  h+='<div class="mese-grasso"><div class="etichetta">'+(netto>=0?"Grasso perso nel mese":"Grasso guadagnato nel mese")+'</div>'+
     '<div class="cifra-g'+(netto<0?" rossa":"")+'">'+num(Math.abs(netto))+'<span class="unita"> g · circa '+num(Math.abs(netto)/1000,2)+' kg</span></div>'+
     '<div class="p-piede">'+num(t.persi)+' g risparmiati nei giorni sotto le '+S.ob.fab+' kcal'+
     (t.presi>0?", "+num(t.presi)+" g ripresi in quelli sopra":"")+
     '. Stima sui '+t.n+(t.n===1?" giorno registrato":" giorni registrati")+', non quello che dice la bilancia.</div></div>';

  h+='<div class="mese-num">'+
     '<div><div class="mini-et">Giorni registrati</div><div class="cifra-m">'+t.n+'<span class="unita"> su '+neiMese+'</span></div></div>'+
     '<div><div class="mini-et">Sotto l’obiettivo</div><div class="cifra-m">'+t.sotto+'<span class="unita"> giorni su '+t.n+'</span></div></div>'+
     '<div><div class="mini-et">Media al giorno</div><div class="cifra-m'+(t.kcal/t.n>S.ob.kcal?" rossa":"")+'">'+num(t.kcal/t.n)+'<span class="unita"> kcal</span></div></div>'+
     '<div><div class="mini-et">Proteine medie</div><div class="cifra-m">'+num(t.p/t.n)+'<span class="unita"> / '+S.ob.p+' g</span></div></div>'+
     '<div><div class="mini-et">Carboidrati medi</div><div class="cifra-m">'+num(t.c/t.n)+'<span class="unita"> g</span></div></div>'+
     '<div><div class="mini-et">Grassi medi</div><div class="cifra-m">'+num(t.g/t.n)+'<span class="unita"> g</span></div></div>'+
     (t.nPassi?'<div><div class="mini-et">Passi medi</div><div class="cifra-m">'+num(t.passi/t.nPassi)+
       '<span class="unita"> in '+t.nPassi+(t.nPassi===1?' giorno':' giorni')+'</span></div></div>':'')+
     (t.pal?'<div><div class="mini-et">Palestra</div><div class="cifra-m">'+t.pal+
       '<span class="unita"> '+(t.pal===1?'allenamento':'allenamenti')+' \u00b7 '+num(t.palSerie)+' serie</span></div></div>':'')+
     '</div>';
  if(t.pal) h+='<div class="p-piede">In palestra hai speso circa '+num(t.palKcal)+' kcal nel mese, '+
     num(t.palKcal/t.pal)+' a seduta. \u00c8 una stima e non entra nei conti qui sopra.</div>';

  h+='</section>';
  return h;
}

function vistaStorico(){
  var giorni=Object.keys(S.indice).sort().reverse();
  if(giorni.length===0) return '<div class="vuoto">Lo storico si riempie da solo: ogni giorno registrato resta qui.</div>';
  var h=pannelloMese(), ultimi=giorni.slice(0,14).slice().reverse();
  var max=Math.max.apply(null,[S.ob.kcal,1].concat(ultimi.map(function(d){return S.indice[d].kcal;})));
  var s7=giorni.slice(0,7);
  var m7={kcal:s7.reduce(function(a,d){return a+S.indice[d].kcal;},0)/s7.length,
          p:s7.reduce(function(a,d){return a+S.indice[d].p;},0)/s7.length,n:s7.length};

  h+='<section class="pannello"><div class="etichetta">Media degli ultimi '+m7.n+' giorni registrati</div>'+
     '<div class="cifra-m">'+num(m7.kcal)+'<span class="unita"> kcal · '+num(m7.p)+' g di proteine</span></div>'+
     '<div class="p-piede">'+(m7.kcal<=S.ob.kcal
       ?"Sotto l'obiettivo di "+num(S.ob.kcal-m7.kcal)+" kcal al giorno"
       :"Sopra l'obiettivo di "+num(m7.kcal-S.ob.kcal)+" kcal al giorno")+'</div></section>';

  h+='<section class="pannello"><div class="etichetta">Ultimi giorni</div><div class="grafico">';
  ultimi.forEach(function(d){
    var v=S.indice[d];
    h+='<div class="col"><div class="col-c"><div class="col-b'+(v.kcal>S.ob.kcal?" oltre":"")+
       '" style="height:'+((v.kcal/max)*100)+'%"></div></div><div class="col-e">'+dataBreve(d)+'</div></div>';
  });
  h+='<div class="obiettivo" style="bottom:'+(22+(S.ob.kcal/max)*118)+'px"></div></div></section>';

  giorni.forEach(function(d){
    var v=S.indice[d];
    h+='<div class="gruppo"><button class="giorno" data-az="apri" data-d="'+d+'"><div>'+
       '<div class="gg-d">'+dataEstesa(d)+'</div><div class="gg-m">P '+v.p+' · C '+v.c+' · G '+v.g+' · '+v.n+(v.n===1?' voce':' voci')+'</div></div>'+
       '<div class="gg-k'+(v.kcal>S.ob.kcal?" rossa":"")+'">'+v.kcal+' kcal</div></button>';
    if(S.aperto===d&&S.apertoDove!=="cal"){
      h+='<div class="dett">'+dettaglioGiorno(S.apertoVoci,true,S.apertoPassi,S.aperto)+'</div>';
    }
    h+='</div>';
  });
  return h;
}
